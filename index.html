    // ============================================================================
    // 2. МАТЕМАТИКА ШТАНГИ, БЛИНОВ IPF, e1RM И DOTS
    // ============================================================================
    function roundToStep(rawWeight, step = 2.5, minWeight = 20) {
      if (!rawWeight || isNaN(rawWeight)) return minWeight;
      const rounded = Math.round(rawWeight / step) * step;
      return Math.max(minWeight, Number(rounded.toFixed(2)));
    }

    function calculatePlatesPerSide(targetWeight, barbellWeight = 20) {
      if (targetWeight <= barbellWeight) {
        return { plates: [], perSideKg: 0 };
      }
      let remainingPerSide = Number(((targetWeight - barbellWeight) / 2).toFixed(3));
      const plates = [];

      for (const plate of PLATE_INVENTORY) {
        while (remainingPerSide >= plate.weight - 0.001) {
          plates.push(plate);
          remainingPerSide = Number((remainingPerSide - plate.weight).toFixed(3));
        }
      }
      return {
        plates,
        perSideKg: Number(((targetWeight - barbellWeight) / 2).toFixed(2)),
      };
    }

    function calculateE1RM(weight, reps) {
      if (!weight || !reps || reps <= 0) return 0;
      if (reps === 1) return weight;
      const epley = weight * (1 + reps / 30);
      const brzycki = reps < 37 ? weight * (36 / (37 - reps)) : epley;
      return Number(((epley + brzycki) / 2).toFixed(1));
    }

    function calculateDOTS(totalKg, bwKg) {
      if (!totalKg || !bwKg || bwKg < 40) return 0;
      const a = -0.000001093;
      const b = 0.0007391293;
      const c = -0.1918759221;
      const d = 24.0900756;
      const e = -307.75076;
      const denom = a * Math.pow(bwKg, 4) + b * Math.pow(bwKg, 3) + c * Math.pow(bwKg, 2) + d * bwKg + e;
      return denom > 0 ? Number(((totalKg * 500) / denom).toFixed(1)) : 0;
    }

    // Парсер твоего формата (% x Повторения x Подходы, например: 70x4x2; 77x3x5)
    function parseCustomTextFormat(rawText, exercises) {
      const lines = rawText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      const items = [];

      lines.forEach((line, idx) => {
        // Ищем все блоки вида 70x4x2 или 75х3х5
        const blockRegex = /(\d+(?:[.,]\d+)?)\s*[xх×]\s*(\d+)\s*[xх×]\s*(\d+)/gi;
        const matches = [...line.matchAll(blockRegex)];
        if (matches.length === 0) return;

        const cleanName = line.replace(blockRegex, '').replace(/[;:\-–]+/g, ' ').replace(/\s{2,}/g, ' ').trim() || `Упражнение #${idx + 1}`;
        const lower = cleanName.toLowerCase();

        let matchedEx = null;
        let bestLen = 0;
        for (const ex of exercises) {
          for (const al of ex.aliases) {
            if (lower.includes(al) && al.length > bestLen) {
              matchedEx = ex;
              bestLen = al.length;
            }
          }
        }

        const blocks = matches.map((m) => ({
          pct: parseFloat(m[1].replace(',', '.')),
          reps: parseInt(m[2], 10),
          sets: parseInt(m[3], 10),
        }));

        items.push({
          name: cleanName,
          exId: matchedEx ? matchedEx.id : null,
          blocks,
          isBase: blocks.some((b) => b.pct > 0),
          note: 'Импортировано из текста / PDF',
        });
      });

      return items;
    }

    async function extractTextFromPdfArrayBuffer(arrayBuffer) {
      if (!window.pdfjsLib) throw new Error('PDF.js не загружен');
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let linesOut = [];
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        const rows = [];
        for (const item of textContent.items) {
          const str = item.str.trim();
          if (!str) continue;
          const x = item.transform[4];
          const y = item.transform[5];
          let row = rows.find((r) => Math.abs(r.y - y) < 5);
          if (!row) {
            row = { y, tokens: [] };
            rows.push(row);
          }
          row.tokens.push({ x, str });
        }
        rows.sort((a, b) => b.y - a.y);
        for (const r of rows) {
          r.tokens.sort((a, b) => a.x - b.x);
          linesOut.push(r.tokens.map((t) => t.str).join(' '));
        }
      }
      return linesOut.join('\n');
    }

    // ============================================================================
    // 3. PLATE LOADER VISUALIZER
    // ============================================================================
    function PlateLoaderVisualizer({ targetWeight, barbellWeight = 20, title }) {
      const { plates, perSideKg } = useMemo(
        () => calculatePlatesPerSide(targetWeight, barbellWeight),
        [targetWeight, barbellWeight]
      );

      const groupedText = useMemo(() => {
        if (plates.length === 0) return 'Пустой гриф (20 кг)';
        return plates.map((p) => `[${p.label}]`).join(' + ');
      }, [plates]);

      return (
        <div className="bg-surface border border-borderSubtle rounded-xl p-4 transition-all">
          <div className="flex items-center justify-between mb-3">
            <div>
              <div className="text-[11px] uppercase tracking-wider text-zinc-500 font-medium">
                Plate Loader · Схема загрузки грифа
              </div>
              <div className="text-sm font-semibold text-zinc-100 mt-0.5">{title}</div>
            </div>
            <div className="text-right">
              <div className="font-mono tabular text-2xl font-bold text-emerald-400">
                {targetWeight} <span className="text-xs font-normal text-zinc-400">кг</span>
              </div>
              <div className="font-mono tabular text-[11px] text-zinc-400">
                Гриф {barbellWeight} кг + по {perSideKg} кг / стор.
              </div>
            </div>
          </div>

          <div className="relative h-24 bg-[#0B0B0E] border border-zinc-800/80 rounded-lg flex items-center justify-center overflow-hidden px-4 my-2">
            <div className="flex items-center">
              <div className="w-16 h-2.5 bg-gradient-to-b from-zinc-400 via-zinc-500 to-zinc-700 rounded-l-sm" />
              <div className="w-2.5 h-8 bg-zinc-300 border-x border-zinc-600 rounded-[1px]" />
              <div className="relative flex items-center gap-[2px] pl-[2px] pr-8 min-w-[160px]">
                <div className="absolute left-0 right-0 h-4 bg-gradient-to-b from-zinc-500 via-zinc-600 to-zinc-800 rounded-r-sm z-0" />
                {plates.map((plate, index) => (
                  <div
                    key={index}
                    style={{
                      height: `${plate.height}px`,
                      width: `${plate.width + 6}px`,
                      backgroundColor: plate.color,
                      borderColor: plate.border,
                    }}
                    className="relative z-10 rounded-[2px] border flex items-center justify-center shadow-md"
                  >
                    <span
                      style={{ color: plate.weight === 5 || plate.weight === 1.25 ? '#09090B' : '#FFFFFF' }}
                      className="font-mono text-[8px] font-bold -rotate-90 select-none"
                    >
                      {plate.label}
                    </span>
                  </div>
                ))}
                {plates.length > 0 && (
                  <div className="relative z-10 w-3 h-6 bg-zinc-300 border border-zinc-500 rounded-[2px] ml-0.5" />
                )}
              </div>
            </div>
          </div>

          <div className="flex items-center justify-between pt-2 border-t border-zinc-800/70 text-xs">
            <span className="text-zinc-500">На каждую сторону:</span>
            <span className="font-mono tabular font-medium text-zinc-200">{groupedText}</span>
          </div>
        </div>
      );
    }

        } catch {
          return {};
        }

      // Custom Importer State
      const [customImportText, setCustomImportText] = useState('Жим штанги лежа 75х3х5\nПриседания 60х8х4\nТяга становая 70х4х4');
      const [customImportedItems, setCustomImportedItems] = useState([]);
      const [pdfMsg, setPdfMsg] = useState('');

      // Timer State
      const [timerSec, setTimerSec] = useState(0);
      const [timerRunning, setTimerRunning] = useState(false);

      // e1RM Quick Calc
      const [calcWeight, setCalcWeight] = useState(110);
      const [calcReps, setCalcReps] = useState(4);

      const fileInputRef = useRef(null);
      const importJsonRef = useRef(null);

      useEffect(() => { localStorage.setItem('ironcore_13w_exercises', JSON.stringify(exercises)); }, [exercises]);
      useEffect(() => { localStorage.setItem('ironcore_13w_done', JSON.stringify(completedSets)); }, [completedSets]);
      useEffect(() => { localStorage.setItem('ironcore_13w_meals', JSON.stringify(mealTemplates)); }, [mealTemplates]);
      useEffect(() => { localStorage.setItem('ironcore_13w_nutrition', JSON.stringify(nutritionLog)); }, [nutritionLog]);

      useEffect(() => {
        if (!timerRunning) return;
        const interval = setInterval(() => {
          setTimerSec((prev) => {
            if (prev <= 1) {
              setTimerRunning(false);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [timerRunning]);

      const startAdaptiveTimer = (isBase) => {
        setTimerSec(isBase ? 240 : 90); // 4 мин в базе, 1.5 мин в подсобке (как в твоем PDF!)
        setTimerRunning(true);
      };

      const formatTime = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const weekObj = useMemo(
        () => BUILTIN_13_WEEKS.find((w) => w.week === selectedWeek) || BUILTIN_13_WEEKS[0],
        [selectedWeek]
      );

      const dayObj = weekObj.days[selectedDayIdx] || weekObj.days[0];

      // Вычисляем килограммы для каждого блока (% x Повторения x Подходы)
      const computedDayItems = useMemo(() => {
        return dayObj.items.map((item, itemIdx) => {
          const ex = item.exId ? exercises.find((e) => e.id === item.exId) : null;
          const computedBlocks = item.blocks.map((b, bIdx) => {
            if (!ex || !b.pct || b.pct <= 0) {
              return { ...b, effectivePct: 0, weightKg: null, blockKey: `w${selectedWeek}-d${selectedDayIdx}-i${itemIdx}-b${bIdx}` };
            }
            const effectivePct = Math.max(30, b.pct + readinessShift);
            const rawKg = (ex.oneRepMax * effectivePct) / 100;
            const weightKg = roundToStep(rawKg, ex.step, ex.barbellWeight);
            return {
              ...b,
              effectivePct,
              weightKg,
              barbellWeight: ex.barbellWeight,
              oneRepMax: ex.oneRepMax,
              blockKey: `w${selectedWeek}-d${selectedDayIdx}-i${itemIdx}-b${bIdx}`,
            };
          });

          return {
            ...item,
            exName: ex ? ex.name : item.name,
            oneRepMax: ex ? ex.oneRepMax : null,
            computedBlocks,
          };
        });
      }, [dayObj, exercises, readinessShift, selectedWeek, selectedDayIdx]);

      // Автоматически ставим в Plate Loader первый базовый подход дня
      useEffect(() => {
        for (const it of computedDayItems) {
          const firstWeighted = it.computedBlocks.find((b) => b.weightKg !== null);
          if (firstWeighted) {
            setActivePlateTarget({
              weight: firstWeighted.weightKg,
              barbell: firstWeighted.barbellWeight || 20,
              title: `${it.name} · ${firstWeighted.effectivePct}% × ${firstWeighted.reps} повт.`,
            });
            return;
          }
        }
        setActivePlateTarget(null);
      }, [computedDayItems]);

      const handleUpdate1RM = (id, newVal) => {
        const num = parseFloat(newVal);
        setExercises((prev) =>
          prev.map((ex) => {
            if (ex.id !== id) return ex;
            const cleanVal = isNaN(num) ? 0 : num;
            const today = new Date().toISOString().slice(0, 10);
            const updatedHistory = [...(ex.history || [])];
            if (cleanVal > 0) {
              const last = updatedHistory[updatedHistory.length - 1];
              if (last && last.date === today) last.weight = cleanVal;
              else updatedHistory.push({ date: today, weight: cleanVal });
            }
            return { ...ex, oneRepMax: cleanVal, history: updatedHistory };
          })
        );

      const toggleSet = (setKey, isBase) => {

            for (let s = 0; s < b.sets; s++) {
              if (completedSets[`${b.blockKey}-s${s}`]) {

        return Math.round(sum);

          const buf = await file.arrayBuffer();

          setCustomImportedItems(parseCustomTextFormat(txt, exercises));

            f: acc.f + (Number(m.f) || 0),
            c: acc.c + (Number(m.c) || 0),

          { kcal: 0, p: 0, f: 0, c: 0 }

        return Number((s + b + d).toFixed(1));

        () => calculateDOTS(sbdTotal, nutritionLog.bodyweight),
        [sbdTotal, nutritionLog.bodyweight]

      const handleExportBackup = () => {

        const a = document.createElement('a');
        a.href = url;

        a.click();
        URL.revokeObjectURL(url);

                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="lg:col-span-5 bg-surface border border-borderSubtle rounded-xl p-5 h-fit">
                <h3 className="text-sm font-semibold text-zinc-100">Калькулятор e1RM (Эпли / Бжицки)</h3>
                <p className="text-xs text-zinc-500 mt-1">
                  Оценка твоего разового максимума по рабочему подходу (например, 110 кг на 4 раза).
                </p>

                <div className="grid grid-cols-2 gap-3 mt-4">
                  <div className="bg-[#0B0B0E] border border-zinc-800 rounded-lg p-3">
                    <label className="text-[11px] text-zinc-500 block">Вес (кг)</label>
                    <input
                      type="number"
                      step="2.5"
                      value={calcWeight}
                      onChange={(e) => setCalcWeight(parseFloat(e.target.value) || 0)}
                      className="w-full mt-1 bg-transparent font-mono tabular text-lg font-bold text-zinc-100 focus:outline-none"
                    />
                  </div>
                  <div className="bg-[#0B0B0E] border border-zinc-800 rounded-lg p-3">
                    <label className="text-[11px] text-zinc-500 block">Повторения</label>
                    <input
                      type="number"
                      min="1"
                      max="20"
                      value={calcReps}
                      onChange={(e) => setCalcReps(parseInt(e.target.value, 10) || 1)}
                      className="w-full mt-1 bg-transparent font-mono tabular text-lg font-bold text-zinc-100 focus:outline-none"
                    />
                  </div>
                </div>

                <div className="mt-4 p-4 rounded-xl bg-[#0B0B0E] border border-emerald-500/20 flex items-center justify-between">
                  <span className="text-xs text-zinc-400">Расчетный 1ПМ:</span>
                  <span className="font-mono tabular text-2xl font-bold text-emerald-400">
                    {calculateE1RM(calcWeight, calcReps)} кг
                  </span>
                </div>
              </div>
            </div>
          )}

          {/* ================= TAB 3: КБЖУ & ВЕС ТЕЛА ================= */}
          {activeTab === 'nutrition' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mt-5">
              <div className="lg:col-span-5 space-y-4">
                <div className="bg-surface border border-borderSubtle rounded-xl p-4">
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-xs font-semibold text-zinc-200">Утренний вес и режим дня</span>
                    <div className="flex items-baseline gap-1 bg-[#0B0B0E] border border-zinc-800 rounded-lg px-2.5 py-1">
                      <input
                        type="number"
                        step="0.1"
                        value={nutritionLog.bodyweight}
                        onChange={(e) =>
                          setNutritionLog((prev) => ({ ...prev, bodyweight: parseFloat(e.target.value) || 0 }))
                        }
                        className="w-12 bg-transparent font-mono tabular text-sm font-bold text-zinc-100 text-right focus:outline-none"
                      />
                      <span className="text-[11px] font-mono text-zinc-500">кг</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => setNutritionLog((p) => ({ ...p, dayType: 'workout' }))}
                      className={`py-2 px-3 rounded-lg text-xs font-medium border ${
                        nutritionLog.dayType === 'workout'
                          ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'
                          : 'bg-[#0B0B0E] border-zinc-800 text-zinc-400'
                      }`}
                    >
                      Тренировочный (3200)
                    </button>
                    <button
                      onClick={() => setNutritionLog((p) => ({ ...p, dayType: 'rest' }))}
                      className={`py-2 px-3 rounded-lg text-xs font-medium border ${
                        nutritionLog.dayType === 'rest'
                          ? 'bg-zinc-800 border-zinc-600 text-zinc-100'
                          : 'bg-[#0B0B0E] border-zinc-800 text-zinc-400'
                      }`}
                    >
                      День отдыха (2750)
                    </button>
                  </div>
                </div>

                <div className="bg-surface border border-borderSubtle rounded-xl p-4">
                  <div className="text-xs font-semibold text-zinc-200 mb-3">Шаблоны питания в 1 тап</div>
                  <div className="space-y-2">
                    {mealTemplates.map((meal) => (
                      <button
                        key={meal.id}
                        onClick={() =>
                          setNutritionLog((prev) => ({
                            ...prev,
                            entries: [...prev.entries, { ...meal, uid: Date.now() + Math.random() }],
                          }))
                        }
                        className="w-full text-left p-3 rounded-lg bg-[#0B0B0E] hover:bg-zinc-900 border border-zinc-800/90 flex items-center justify-between transition-colors"
                      >
                        <div>
                          <div className="text-xs font-medium text-zinc-200">{meal.name}</div>
                          <div className="font-mono tabular text-[10px] text-zinc-500 mt-0.5">
                            Б: {meal.p}г · Ж: {meal.f}г · У: {meal.c}г
                          </div>
                        </div>
                        <span className="font-mono tabular text-xs font-semibold text-emerald-400">
                          +{meal.kcal} ккал
                        </span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div className="lg:col-span-7">
                <div className="bg-surface border border-borderSubtle rounded-xl p-5">
                  <div className="flex items-baseline justify-between mb-4">
                    <div>
                      <div className="text-xs text-zinc-500">Сводка КБЖУ за сегодня</div>
                      <div className="font-mono tabular text-2xl font-bold text-zinc-100 mt-0.5">
                        {nutritionTotals.kcal}{' '}
                        <span className="text-sm font-normal text-zinc-500">/ {targetKcal} ккал</span>
                      </div>
                    </div>
                    <button
                      onClick={() => setNutritionLog((p) => ({ ...p, entries: [] }))}
                      className="text-[11px] text-zinc-500 hover:text-zinc-300 underline"
                    >
                      Очистить день
                    </button>
                  </div>

                  <div className="w-full h-2.5 bg-[#0B0B0E] rounded-full overflow-hidden border border-zinc-800 mb-5">
                    <div
                      style={{ width: `${Math.min(100, (nutritionTotals.kcal / targetKcal) * 100)}%` }}
                      className="h-full bg-emerald-500 transition-all duration-300"
                    />
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div className="p-3 rounded-xl bg-[#0B0B0E] border border-zinc-800">
                      <div className="text-[11px] text-zinc-500">Белки</div>
                      <div className="font-mono tabular text-base font-bold text-zinc-100 mt-0.5">
                        {Math.round(nutritionTotals.p)} / {targetProtein} г
                      </div>
                    </div>
                    <div className="p-3 rounded-xl bg-[#0B0B0E] border border-zinc-800">
                      <div className="text-[11px] text-zinc-500">Жиры</div>
                      <div className="font-mono tabular text-base font-bold text-zinc-100 mt-0.5">
                        {Math.round(nutritionTotals.f)} г
                      </div>
                    </div>
                    <div className="p-3 rounded-xl bg-[#0B0B0E] border border-zinc-800">
                      <div className="text-[11px] text-zinc-500">Углеводы</div>
                      <div className="font-mono tabular text-base font-bold text-zinc-100 mt-0.5">
                        {Math.round(nutritionTotals.c)} г
                      </div>
                    </div>
                  </div>

                  <div className="mt-5 pt-4 border-t border-borderSubtle space-y-1.5">
                    <div className="text-xs font-medium text-zinc-400 mb-2">Съедено сегодня:</div>
                    {nutritionLog.entries.map((item, idx) => (
                      <div
                        key={item.uid || idx}
                        className="flex items-center justify-between px-3 py-2 rounded-lg bg-[#0B0B0E] border border-zinc-800/80 text-xs"
                      >
                        <span className="text-zinc-200">{item.name}</span>
                        <div className="flex items-center gap-3">
                          <span className="font-mono tabular text-zinc-400">{item.kcal} ккал</span>
                          <button
                            onClick={() =>
                              setNutritionLog((p) => ({
                                ...p,
                                entries: p.entries.filter((_, i) => i !== idx),
                              }))
                            }
                            className="text-zinc-500 hover:text-red-400 font-mono"
                          >
                            ×
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================= TAB 4: ЗАГРУЗИТЬ НОВЫЙ PDF / ТЕКСТ ================= */}
          {activeTab === 'import' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mt-5">
              <div className="lg:col-span-5 bg-surface border border-borderSubtle rounded-xl p-4 space-y-3">
                <div className="text-xs font-semibold text-zinc-200">
                  Парсер новых программ в твоем формате (% × Повт × Подх)
                </div>
                <div
                  onClick={() => fileInputRef.current?.click()}
                  className="border border-dashed border-zinc-700 hover:border-emerald-500/60 bg-[#0C0C0F] rounded-lg p-4 text-center cursor-pointer"
                >
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept="application/pdf"
                    className="hidden"
                    onChange={(e) => handlePdfUpload(e.target.files?.[0])}
                  />
                  <div className="text-xs text-zinc-300 font-medium">Выбрать PDF-файл</div>
                  {pdfMsg && <div className="text-[11px] text-emerald-400 mt-1 font-mono">{pdfMsg}</div>}
                </div>

                <textarea
                  rows={7}
                  value={customImportText}
                  onChange={(e) => setCustomImportText(e.target.value)}
                  className="w-full bg-[#0B0B0E] border border-zinc-800 rounded-lg p-3 font-mono text-xs text-zinc-200"
                />
                <button
                  onClick={() => setCustomImportedItems(parseCustomTextFormat(customImportText, exercises))}
                  className="w-full py-2.5 rounded-lg bg-emerald-500 text-zinc-950 text-xs font-bold hover:bg-emerald-400"
                >
                  Пересчитать в килограммы
                </button>
              </div>

              <div className="lg:col-span-7 bg-surface border border-borderSubtle rounded-xl p-4">
                <div className="text-xs font-semibold text-zinc-200 mb-3">Результат распознавания</div>
                {customImportedItems.length === 0 ? (
                  <p className="text-xs text-zinc-500">Нажми «Пересчитать в килограммы» или загрузи PDF слева.</p>
                ) : (
                  <div className="space-y-3">
                    {customImportedItems.map((it, i) => {
                      const ex = it.exId ? exercises.find((e) => e.id === it.exId) : null;
                      return (
                        <div key={i} className="p-3 rounded-lg bg-[#0B0B0E] border border-zinc-800">
                          <div className="text-sm font-semibold text-zinc-100">{it.name}</div>
                          <div className="mt-2 flex flex-wrap gap-2">
                            {it.blocks.map((b, bi) => {
                              const kg = ex && b.pct > 0 ? roundToStep((ex.oneRepMax * b.pct) / 100, ex.step, ex.barbellWeight) : null;
                              return (
                                <span key={bi} className="px-2.5 py-1 rounded bg-surface border border-zinc-700 font-mono text-xs text-emerald-400">
                                  {kg ? `${kg} кг (${b.pct}% × ${b.reps} × ${b.sets})` : `${b.reps} × ${b.sets}`}
                                </span>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ================= TAB 5: ANALYTICS & DOTS ================= */}
          {activeTab === 'analytics' && (
            <div className="mt-5 space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div className="bg-surface border border-borderSubtle rounded-xl p-4">
                  <div className="text-[11px] uppercase text-zinc-500">Сумма троеборья (SBD)</div>
                  <div className="font-mono tabular text-2xl font-bold text-zinc-100 mt-1">{sbdTotal} кг</div>
                </div>
                <div className="bg-surface border border-borderSubtle rounded-xl p-4">
                  <div className="text-[11px] uppercase text-zinc-500">Коэффициент DOTS (IPF)</div>
                  <div className="font-mono tabular text-2xl font-bold text-emerald-400 mt-1">{dotsScore}</div>
                </div>
                <div className="bg-surface border border-borderSubtle rounded-xl p-4">
                  <div className="text-[11px] uppercase text-zinc-500">Резервная копия</div>
                  <button
                    onClick={handleExportBackup}
                    className="mt-2 px-3 py-1.5 rounded-lg bg-zinc-100 text-zinc-950 text-xs font-semibold"
                  >
                    Скачать JSON-файл
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= MOBILE BOTTOM BAR ================= */}
          <nav className="sm:hidden fixed bottom-0 left-0 right-0 bg-[#09090B]/95 backdrop-blur-lg border-t border-borderSubtle px-2 pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] z-50">
            <div className="grid grid-cols-4 gap-1">
              {[
                { id: 'workout', label: '13 Недель' },
                { id: '1rm', label: 'База 1ПМ' },
                { id: 'nutrition', label: 'КБЖУ' },
                { id: 'import', label: '+ PDF' },
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`py-2.5 rounded-xl text-[11px] font-medium transition-colors ${
                    activeTab === tab.id ? 'bg-zinc-800 text-zinc-100 font-semibold' : 'text-zinc-500'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
