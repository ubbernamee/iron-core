    const NativeiOSBridge = {
      isNativeCapacitor() {
        return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
      },
      getPlugin() {
        return window.Capacitor?.Plugins?.IronCoreLiveActivity || null;
      },
      haptic(style = 'medium', enabled = true) {
        if (!enabled) return;
        try {
          const plugin = this.getPlugin();
          if (plugin && plugin.triggerHaptic) {
            plugin.triggerHaptic({ style });
            return;
          }
          const lbl = document.getElementById('ios-haptic-label');
          if (lbl) lbl.click();
          if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 18 : 10);
        } catch {}
      },
      async syncLiveActivity(payload) {
        try {
          const plugin = this.getPlugin();
          if (plugin && plugin.startOrUpdateActivity) {
            await plugin.startOrUpdateActivity(payload);
            return true;
          }
        } catch {}
        return false;
      },
      async endLiveActivity() {
        try {
          const plugin = this.getPlugin();
          if (plugin && plugin.endActivity) await plugin.endActivity();
        } catch {}
      },
      triggerShortcutsDynamicIslandTimer(seconds, shortcutName = 'IronCoreTimer') {
        try {
          const encodedName = encodeURIComponent(shortcutName || 'IronCoreTimer');
          window.location.href = `shortcuts://run-shortcut?name=${encodedName}&input=text&text=${Math.round(seconds)}`;
        } catch {}
      },
      wakeLockSentinel: null,
      async setKeepAwake(enabled) {
        try {
          const plugin = this.getPlugin();
          if (plugin && plugin.setKeepAwake) {
            await plugin.setKeepAwake({ enabled });
            return true;
          }
          if ('wakeLock' in navigator) {
            if (enabled) {
              if (!this.wakeLockSentinel) {
                this.wakeLockSentinel = await navigator.wakeLock.request('screen');
                this.wakeLockSentinel.addEventListener('release', () => { this.wakeLockSentinel = null; });
              }
              return true;
            } else if (this.wakeLockSentinel) {
              await this.wakeLockSentinel.release();
              this.wakeLockSentinel = null;
            }
          }
        } catch {}
        return false;
      },
      async shareText(title, text) {
        if (navigator.share) {
          try { await navigator.share({ title, text }); return true; } catch { return false; }
        }
        try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
      },
      playChime() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const now = ctx.currentTime;
          [880, 1174.66].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.14);
            gain.gain.setValueAtTime(0.16, now + i * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.14 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.14);
            osc.stop(now + i * 0.14 + 0.36);
          });
        } catch {}
      },
    };

    function matchExerciseId(lineLower) {
      let bestId = null;
      let bestLen = 0;
      for (const ex of DEFAULT_EXERCISES) {
        for (const al of ex.aliases) {
          if (lineLower.includes(al) && al.length > bestLen) {
            bestId = ex.id;
            bestLen = al.length;
          }
        }
      }
      return bestId;
    }

    function parseUniversalProgram(rawText) {
      const lines = rawText
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter(Boolean);

      const weeks = [];
      let currentWeek = null;
      let currentDay = null;

      const ensureWeek = (num, title) => {
        currentWeek = {
          week: num,
          title: title || `${num} НЕДЕЛЯ`,
          days: [],
        };
        weeks.push(currentWeek);
      };

      const ensureDay = (dayShort, title) => {
        if (!currentWeek) ensureWeek(1, '1 НЕДЕЛЯ');
        currentDay = {
          day: dayShort,
          title: title || `${currentWeek.week} Неделя · ${dayShort}`,
          items: [],
        };
        currentWeek.days.push(currentDay);
      };

      const weekRe = /^(?:неделя\s*(\d+)|(\d+)\s*неделя|week\s*(\d+))/i;
      const dayRe = /^(пн|вт|ср|чт|пт|сб|вс|понедельник|вторник|среда|четверг|пятница|суббота|воскресенье|день\s*\d+|day\s*\d+|тренировка\s*\d+)\b/i;

      const dayShortMap = {
        понедельник: 'Пн', вторник: 'Вт', среда: 'Ср', четверг: 'Чт',
        пятница: 'Пт', суббота: 'Сб', воскресенье: 'Вс',
        пн: 'Пн', вт: 'Вт', ср: 'Ср', чт: 'Чт', пт: 'Пт', сб: 'Сб', вс: 'Вс',
      };

      for (const rawLine of lines) {
        const line = rawLine.replace(/^[\d]+\.\s*/, '').trim();
        if (!line) continue;

        // 1) Заголовок недели
        const wm = line.match(weekRe);
        if (wm && !line.includes('%') && !/\d+\s*[xх×]\s*\d+/i.test(line)) {
          const wNum = parseInt(wm[1] || wm[2] || wm[3], 10) || (weeks.length + 1);
          ensureWeek(wNum, line.replace(/[:\-–]+$/, '').trim());
          currentDay = null;
          continue;
        }

        // 2) Заголовок дня
        const dm = line.match(dayRe);
        if (dm && !line.includes('%') && !/\d+\s*[xх×]\s*\d+/i.test(line)) {
          const key = dm[1].toLowerCase();
          const shortLabel = dayShortMap[key] || dm[1].replace(/день\s*/i, 'Д').replace(/day\s*/i, 'D').replace(/тренировка\s*/i, 'Т');
          if (!currentWeek) ensureWeek(1, '1 НЕДЕЛЯ');
          ensureDay(shortLabel, `${currentWeek.week} Неделя · ${line.replace(/[:\-–]+$/, '').trim()}`);
          continue;
        }

        // 3) Строка упражнения
        if (!currentWeek) ensureWeek(1, '1 НЕДЕЛЯ');
        if (!currentDay) ensureDay('День 1', `${currentWeek.week} Неделя · День 1`);

        // Формат A: (% x Повторения x Подходы), например "70х4х2; 77.5x3x5" или "0х10х3"
        const tripleRe = /(\d+(?:[.,]\d+)?)\s*[xх×*]\s*(\d+)\s*[xх×*]\s*(\d+)/gi;
        const tripleMatches = [...line.matchAll(tripleRe)];

        let blocks = [];
        let cleanName = line;

        if (tripleMatches.length > 0) {
          blocks = tripleMatches.map((m) => ({
            pct: parseFloat(m[1].replace(',', '.')),
            reps: parseInt(m[2], 10),
            sets: parseInt(m[3], 10),
          }));
          cleanName = line.replace(tripleRe, '').replace(/[;:\-–]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
        } else {
          // Формат B1: несколько волн вида "4*4 75% 2*8 60%" или "4x4 @ 80% 2x2 @ 90%"
          const multiWaveRe = /(\d+)\s*[xх×*]\s*(\d+)\s*@?\s*(\d+(?:[.,]\d+)?)\s*%/gi;
          const multiWaveMatches = [...line.matchAll(multiWaveRe)];

          if (multiWaveMatches.length > 0) {
            blocks = multiWaveMatches.map((m) => ({
              sets: parseInt(m[1], 10),
              reps: parseInt(m[2], 10),
              pct: parseFloat(m[3].replace(',', '.')),
            }));
            cleanName = line
              .replace(multiWaveRe, '')
              .replace(/\(?\s*rpe\s*\d+(?:[.,]\d+)?\s*\)?/gi, '')
              .replace(/[;:\-–@]+/g, ' ')
              .replace(/\s{2,}/g, ' ')
              .trim();
          } else {
            // Формат B2: одиночный блок без % (подсобка "4*12") или с %
            const srRe = /(\d+)\s*[xх×*]\s*(\d+)/i;
            const pctRe = /@?\s*(\d+(?:[.,]\d+)?)\s*%/;
            const srM = line.match(srRe);
            const pctM = line.match(pctRe);

            if (!srM && !pctM) continue;

            const sets = srM ? parseInt(srM[1], 10) : 3;
            const reps = srM ? parseInt(srM[2], 10) : 8;
            const pct = pctM ? parseFloat(pctM[1].replace(',', '.')) : 0;

            blocks = [{ pct, reps, sets }];
            cleanName = line
              .replace(srRe, '')
              .replace(pctRe, '')
              .replace(/\(?\s*rpe\s*\d+(?:[.,]\d+)?\s*\)?/gi, '')
              .replace(/[;:\-–@]+/g, ' ')
              .replace(/\s{2,}/g, ' ')
              .trim();
          }
        }

        if (!cleanName || cleanName.length < 2) continue;

        const exId = matchExerciseId(cleanName.toLowerCase());
        const hasPct = blocks.some((b) => b.pct > 0);
        // Если есть % но упражнение не определилось, пробуем оставить exId null (покажет как подсобку или привяжем)
        const isBase = !!(exId && hasPct);

        currentDay.items.push({
          name: cleanName,
          exId: isBase ? exId : null,
          blocks,
          isBase,
          note: isBase ? 'Авторасчет от твоего 1ПМ' : 'Подсобка · вес индивидуально',
        });
      }

      // Убираем пустые дни и пустые недели
      const cleanedWeeks = weeks
        .map((w) => ({
          ...w,
          days: w.days.filter((d) => d.items.length > 0),
        }))
        .filter((w) => w.days.length > 0);

      // Перенумеровываем недели 1..N на всякий случай
      return cleanedWeeks.map((w, idx) => ({ ...w, week: idx + 1 }));
    }

    async function extractTextFromPdfArrayBuffer(arrayBuffer) {
      if (!window.pdfjsLib) throw new Error('PDF.js не загружен. Проверь интернет.');
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const linesOut = [];
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        const rows = [];
        for (const item of textContent.items) {
          const str = item.str.trim();
          if (!str) continue;
          const x = item.transform[4];
          const y = item.transform[5];
          let row = rows.find((r) => Math.abs(r.y - y) < 5);
          if (!row) {
            row = { y, tokens: [] };
            rows.push(row);
          }
          row.tokens.push({ x, str });
        }
        rows.sort((a, b) => b.y - a.y);
        for (const r of rows) {
          r.tokens.sort((a, b) => a.x - b.x);
          linesOut.push(r.tokens.map((t) => t.str).join(' '));
        }
      }
      return linesOut.join('\n');
    }

    // ============================================================================
    // 3. МАТЕМАТИКА ШТАНГИ, БЛИНОВ IPF, e1RM И DOTS
    // ============================================================================
    function roundToStep(rawWeight, step = 2.5, minWeight = 20) {
      if (!rawWeight || isNaN(rawWeight)) return minWeight;
      const rounded = Math.round(rawWeight / step) * step;
      return Math.max(minWeight, Number(rounded.toFixed(2)));
    }

    function calculatePlatesPerSide(targetWeight, barbellWeight = 20) {
      if (targetWeight <= barbellWeight) return { plates: [], perSideKg: 0 };
      let remainingPerSide = Number(((targetWeight - barbellWeight) / 2).toFixed(3));
      const plates = [];
      for (const plate of PLATE_INVENTORY) {
        while (remainingPerSide >= plate.weight - 0.001) {
          plates.push(plate);
          remainingPerSide = Number((remainingPerSide - plate.weight).toFixed(3));
        }
      }
      return {
        plates,
        perSideKg: Number(((targetWeight - barbellWeight) / 2).toFixed(2)),
      };
    }

    function calculateE1RM(weight, reps) {
      if (!weight || !reps || reps <= 0) return 0;
      if (reps === 1) return weight;
      const epley = weight * (1 + reps / 30);
      const brzycki = reps < 37 ? weight * (36 / (37 - reps)) : epley;
      return Number(((epley + brzycki) / 2).toFixed(1));
    }

    function calculateDOTS(totalKg, bwKg) {
      if (!totalKg || !bwKg || bwKg < 40) return 0;
      const a = -0.000001093;
      const b = 0.0007391293;
      const c = -0.1918759221;
      const d = 24.0900756;
      const e = -307.75076;
      const denom = a * Math.pow(bwKg, 4) + b * Math.pow(bwKg, 3) + c * Math.pow(bwKg, 2) + d * bwKg + e;
      return denom > 0 ? Number(((totalKg * 500) / denom).toFixed(1)) : 0;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function BottomSheet({ isOpen, onClose, title, subtitle, hapticsEnabled, children }) {
      const [dragY, setDragY] = useState(0);
      const startYRef = useRef(null);

      useEffect(() => {
        if (isOpen) {
          setDragY(0);
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
        return () => { document.body.style.overflow = ''; };
      }, [isOpen]);

      if (!isOpen) return null;

      const handleTouchStart = (e) => { startYRef.current = e.touches[0].clientY; };
      const handleTouchMove = (e) => {
        if (startYRef.current === null) return;
        const delta = e.touches[0].clientY - startYRef.current;
        if (delta > 0) setDragY(delta);
      };
      const handleTouchEnd = () => {
        if (dragY > 105) {
          NativeiOSBridge.haptic('light', hapticsEnabled);
          onClose();
        } else {
          setDragY(0);
        }
        startYRef.current = null;
      };

      return (
        <div
          onClick={() => { NativeiOSBridge.haptic('light', hapticsEnabled); onClose(); }}
          className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              transform: `translateY(${dragY}px)`,
              transition: dragY === 0 ? 'transform 0.28s cubic-bezier(0.22, 1, 0.36, 1)' : 'none',
            }}
            className="animate-sheet-up w-full max-w-lg bg-[#121217] border-t sm:border border-zinc-700/80 rounded-t-[30px] sm:rounded-2xl shadow-[0_-18px_50px_rgba(0,0,0,0.9)] max-h-[89vh] flex flex-col pb-[env(safe-area-inset-bottom)]"

              onTouchMove={handleTouchMove}

                </button>

    function App() {

        try {
          const raw = localStorage.getItem('ironcore_v6_session') || localStorage.getItem('ironcore_v5_session');
          return raw ? JSON.parse(raw) : {};
        } catch {
          return {};
        }
      }, []);

      const [programs, setPrograms] = useState(() => {
        try {
          const saved = localStorage.getItem('ironcore_v6_programs');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              // Подмешиваем новые встроенные программы (например, TATWOLE BUILDING), сохраняя кастомные
              const existingIds = new Set(parsed.map((p) => p.id));
              const merged = [...parsed];
              for (const bp of DEFAULT_PROGRAMS) {
                if (!existingIds.has(bp.id)) merged.push(bp);
              }

            }

          return DEFAULT_PROGRAMS;
        } catch {

        wakeLockEnabled: savedSession.iosSettings?.wakeLockEnabled ?? true,
        shortcutsIslandEnabled: savedSession.iosSettings?.shortcutsIslandEnabled ?? false,
        shortcutName: savedSession.iosSettings?.shortcutName || 'IronCoreTimer',
      }));

      const [activeTab, setActiveTab] = useState(savedSession.activeTab || 'workout');
      const [readinessShift, setReadinessShift] = useState(savedSession.readinessShift || 0);
      const [recipeCategory, setRecipeCategory] = useState(savedSession.recipeCategory || 'Все');
      const [checkedIngredients, setCheckedIngredients] = useState(savedSession.checkedIngredients || {});
      const [selectedFridgeItems, setSelectedFridgeItems] = useState(
        savedSession.selectedFridgeItems || ['творог', 'яйц', 'курин']
      );

      // UI Sheets
      const [islandExpanded, setIslandExpanded] = useState(false);
      const [activePlateTarget, setActivePlateTarget] = useState(null);
      const [activeRecipeSheet, setActiveRecipeSheet] = useState(null);
      const [recipePortionScale, setRecipePortionScale] = useState(1);
      const [isFilterSheetOpen, setIsFilterSheetOpen] = useState(false);
      const [isSettingsSheetOpen, setIsSettingsSheetOpen] = useState(false);
      const [isProgramsSheetOpen, setIsProgramsSheetOpen] = useState(false);
      const [programsSheetMode, setProgramsSheetMode] = useState('list'); // 'list' | 'add'

      // Новая программа (форма добавления)
      const [newProgTitle, setNewProgTitle] = useState('');
      const [newProgBadge, setNewProgBadge] = useState('NEW');
      const [newProgRawText, setNewProgRawText] = useState('');
      const [pdfImportStatus, setPdfImportStatus] = useState('');
      const pdfFileInputRef = useRef(null);

      // Таймер с привязкой к абсолютному времени
      const initialRemaining = savedSession.timerEndTime
        ? Math.max(0, Math.round((savedSession.timerEndTime - Date.now()) / 1000))
        : 0;
      const [timerEndTime, setTimerEndTime] = useState(initialRemaining > 0 ? savedSession.timerEndTime : null);
      const [timerSec, setTimerSec] = useState(initialRemaining);
      const [timerTotal, setTimerTotal] = useState(savedSession.timerTotal || 180);
      const [timerRunning, setTimerRunning] = useState(initialRemaining > 0);

      // e1RM Quick Calc
      const [calcExId, setCalcExId] = useState('bench');
      const [calcWeight, setCalcWeight] = useState(85);
      const [calcReps, setCalcReps] = useState(5);

      const importJsonRef = useRef(null);

      // Активная программа + текущие неделя и день для неё
      const activeProgram = useMemo(
        () => programs.find((p) => p.id === activeProgramId) || programs[0],
        [programs, activeProgramId]
      );

      const currentPos = programPositions[activeProgram.id] || { week: 1, dayIdx: 0 };
      const selectedWeek = currentPos.week;
      const selectedDayIdx = currentPos.dayIdx;

      const setSelectedWeek = (weekNum) => {
        setProgramPositions((prev) => ({
          ...prev,
          [activeProgram.id]: { week: weekNum, dayIdx: 0 },
        }));
      };

      const setSelectedDayIdx = (dayIdx) => {
        setProgramPositions((prev) => ({
          ...prev,
          [activeProgram.id]: { ...(prev[activeProgram.id] || { week: 1 }), dayIdx },
        }));
      };

      const handleSwitchProgram = (progId) => {
        NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        setActiveProgramId(progId);
        setActiveTab('workout');
        setIsProgramsSheetOpen(false);
      };

      // Живой предпросмотр парсинга новой программы
      const parsedNewProgramWeeks = useMemo(() => {
        if (!newProgRawText.trim()) return [];
        return parseUniversalProgram(newProgRawText);
      }, [newProgRawText]);

      const parsedNewStats = useMemo(() => {
        const wCount = parsedNewProgramWeeks.length;
        const dCount = parsedNewProgramWeeks.reduce((s, w) => s + w.days.length, 0);
        const exCount = parsedNewProgramWeeks.reduce(
          (s, w) => s + w.days.reduce((sd, d) => sd + d.items.length, 0),
          0
        );
        return { wCount, dCount, exCount };
      }, [parsedNewProgramWeeks]);

      const handlePdfProgramUpload = async (file) => {
        if (!file) return;
        setPdfImportStatus('Читаем PDF...');
        try {
          const buf = await file.arrayBuffer();
          const txt = await extractTextFromPdfArrayBuffer(buf);
          if (!txt.trim()) {
            setPdfImportStatus('В PDF нет текстового слоя (возможно, это скан-картинка). Вставь текст ниже.');
            return;
          }
          setNewProgRawText(txt);
          if (!newProgTitle.trim()) {
            setNewProgTitle(file.name.replace(/\.pdf$/i, '').slice(0, 28));
          }
          setPdfImportStatus(`Загружен: ${file.name}`);
          NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        } catch (err) {
          setPdfImportStatus('Ошибка PDF: ' + err.message);
        }
      };

      const handleSaveNewProgram = () => {
        if (parsedNewProgramWeeks.length === 0) return;
        const id = `prog-${Date.now()}`;
        const title = newProgTitle.trim() || `Программа #${programs.length + 1}`;
        const badge = (newProgBadge.trim() || `${parsedNewStats.wCount} НЕД`).slice(0, 8).toUpperCase();
        const newProg = {
          id,
          title,
          badge,
          description: `${parsedNewStats.wCount} нед. · ${parsedNewStats.dCount} трен. дней`,
          isBuiltIn: false,
          weeks: parsedNewProgramWeeks,
        };
        setPrograms((prev) => [...prev, newProg]);
        setProgramPositions((prev) => ({ ...prev, [id]: { week: 1, dayIdx: 0 } }));
        setActiveProgramId(id);
        setActiveTab('workout');
        setNewProgTitle('');
        setNewProgBadge('NEW');
        setNewProgRawText('');
        setPdfImportStatus('');
        setProgramsSheetMode('list');
        setIsProgramsSheetOpen(false);
        NativeiOSBridge.haptic('heavy', iosSettings.hapticsEnabled);
      };

      const handleDeleteProgram = (progId) => {
        const target = programs.find((p) => p.id === progId);
        if (!target || target.isBuiltIn) return;
        if (!confirm(`Удалить программу «${target.title}»?`)) return;
        NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        setPrograms((prev) => prev.filter((p) => p.id !== progId));
        if (activeProgramId === progId) setActiveProgramId('path-100kg');
      };

      // Persist all data
      useEffect(() => { localStorage.setItem('ironcore_v6_programs', JSON.stringify(programs)); }, [programs]);
      useEffect(() => { localStorage.setItem('ironcore_v5_ex', JSON.stringify(exercises)); }, [exercises]);
      useEffect(() => { localStorage.setItem('ironcore_v5_done', JSON.stringify(completedSets)); }, [completedSets]);
      useEffect(() => { localStorage.setItem('ironcore_v5_meals', JSON.stringify(mealTemplates)); }, [mealTemplates]);
      useEffect(() => { localStorage.setItem('ironcore_v5_nutr', JSON.stringify(nutritionLog)); }, [nutritionLog]);

      // Persist complete session state
      useEffect(() => {
        try {
          localStorage.setItem(
            'ironcore_v6_session',
            JSON.stringify({
              activeTab,
              activeProgramId,
              programPositions,
              readinessShift,
              recipeCategory,
              checkedIngredients,
              selectedFridgeItems,
              timerEndTime,
              timerTotal,
              iosSettings,
            })
          );
        } catch {}
      }, [
        activeTab,
        activeProgramId,
        programPositions,
        readinessShift,
        recipeCategory,
        checkedIngredients,
        selectedFridgeItems,
        timerEndTime,
        timerTotal,
        iosSettings,
      ]);

      // Wake Lock management
      useEffect(() => {
        NativeiOSBridge.setKeepAwake(iosSettings.wakeLockEnabled);
        const onVisibility = () => {
          if (document.visibilityState === 'visible' && iosSettings.wakeLockEnabled) {
            NativeiOSBridge.setKeepAwake(true);
          }
        };
        document.addEventListener('visibilitychange', onVisibility);
        return () => {
          document.removeEventListener('visibilitychange', onVisibility);
          NativeiOSBridge.setKeepAwake(false);
        };
      }, [iosSettings.wakeLockEnabled]);

      // Restore & save exact scroll position
      useEffect(() => {
        const savedScroll = parseInt(localStorage.getItem('ironcore_v5_scroll') || '0', 10);
        if (savedScroll > 0) requestAnimationFrame(() => window.scrollTo(0, savedScroll));
        let t;
        const onScroll = () => {
          clearTimeout(t);
          t = setTimeout(() => { localStorage.setItem('ironcore_v5_scroll', String(window.scrollY)); }, 140);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => { window.removeEventListener('scroll', onScroll); clearTimeout(t); };
      }, []);

      const weekObj = useMemo(
        () => activeProgram.weeks.find((w) => w.week === selectedWeek) || activeProgram.weeks[0],
        [activeProgram, selectedWeek]
      );
      const dayObj = weekObj.days[selectedDayIdx] || weekObj.days[0];

      // Префикс ключа подходов (пустой для 'path-100kg' для 100% обратной совместимости с твоими отметками!)
      const progKeyPrefix = activeProgram.id === 'path-100kg' ? '' : `${activeProgram.id}-`;

      const computedDayItems = useMemo(() => {
        return dayObj.items.map((item, itemIdx) => {
          const ex = item.exId ? exercises.find((e) => e.id === item.exId) : null;
          const computedBlocks = item.blocks.map((b, bIdx) => {
            if (!ex || !b.pct || b.pct <= 0) {
              return {
                ...b,
                effectivePct: 0,
                weightKg: null,
                barbellWeight: 20,
                blockKey: `${progKeyPrefix}w${weekObj.week}-d${selectedDayIdx}-i${itemIdx}-b${bIdx}`,
              };
            }
            const effectivePct = Math.max(30, b.pct + readinessShift);
            const rawKg = (ex.oneRepMax * effectivePct) / 100;
            const weightKg = roundToStep(rawKg, ex.step, ex.barbellWeight);
            return {
              ...b,
              effectivePct,
              weightKg,
              barbellWeight: ex.barbellWeight,
              oneRepMax: ex.oneRepMax,
              blockKey: `${progKeyPrefix}w${weekObj.week}-d${selectedDayIdx}-i${itemIdx}-b${bIdx}`,
            };
          });
          return {
            ...item,
            exName: ex ? ex.name : item.name,
            oneRepMax: ex ? ex.oneRepMax : null,
            computedBlocks,
          };
        });
      }, [dayObj, exercises, readinessShift, progKeyPrefix, weekObj.week, selectedDayIdx]);

      const flatDaySets = useMemo(() => {
        const list = [];
        computedDayItems.forEach((item, itemIdx) => {
          item.computedBlocks.forEach((b) => {
            for (let sIdx = 0; sIdx < b.sets; sIdx++) {
              const setKey = `${b.blockKey}-s${sIdx}`;
              list.push({
                setKey,
                itemIdx,
                exerciseName: item.name,
                isBase: item.isBase,
                setNumber: sIdx + 1,
                totalSetsInBlock: b.sets,
                reps: b.reps,
                effectivePct: b.effectivePct,
                weightKg: b.weightKg,
                barbellWeight: b.barbellWeight || 20,
                done: !!completedSets[setKey],
              });
            }
          });
        });
        return list;
      }, [computedDayItems, completedSets]);

      const nextPendingSet = useMemo(() => flatDaySets.find((s) => !s.done) || null, [flatDaySets]);
      const completedSetsCount = useMemo(() => flatDaySets.filter((s) => s.done).length, [flatDaySets]);

      // Sync with Native iOS ActivityKit Dynamic Island
      useEffect(() => {
        if (!isNativeApp) return;
        if (!nextPendingSet && !timerRunning) {
          NativeiOSBridge.endLiveActivity();
          return;
        }
        NativeiOSBridge.syncLiveActivity({
          exerciseName: nextPendingSet ? nextPendingSet.exerciseName : 'Тренировка завершена',
          weightKg: nextPendingSet?.weightKg || 0,
          reps: nextPendingSet?.reps || 0,
          setNumber: nextPendingSet?.setNumber || completedSetsCount,
          completedSets: completedSetsCount,
          totalSets: flatDaySets.length,
          timerEndTimestamp: timerRunning && timerEndTime ? Math.floor(timerEndTime / 1000) : 0,
          isResting: timerRunning,
        });
      }, [isNativeApp, nextPendingSet, completedSetsCount, flatDaySets.length, timerRunning, timerEndTime]);

      // Timer countdown tick
      useEffect(() => {
        if (!timerRunning || !timerEndTime) return;
        const interval = setInterval(() => {
          const left = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
          setTimerSec(left);
          if (left <= 0) {
            setTimerRunning(false);
            setTimerEndTime(null);
            NativeiOSBridge.playChime();
            NativeiOSBridge.haptic('heavy', iosSettings.hapticsEnabled);
          }
        }, 400);
        return () => clearInterval(interval);
      }, [timerRunning, timerEndTime, iosSettings.hapticsEnabled]);

      const startTimer = useCallback((sec) => {
        NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        const end = Date.now() + sec * 1000;
        setTimerTotal(sec);
        setTimerEndTime(end);
        setTimerSec(sec);
        setTimerRunning(true);
        if (!isNativeApp && iosSettings.shortcutsIslandEnabled) {
          NativeiOSBridge.triggerShortcutsDynamicIslandTimer(sec, iosSettings.shortcutName);
        }
      }, [isNativeApp, iosSettings]);

      const stopTimer = useCallback(() => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        setTimerRunning(false);
        setTimerEndTime(null);
        setTimerSec(0);
      }, [iosSettings.hapticsEnabled]);

      // Update 3D Barbell under current set
      useEffect(() => {
        if (nextPendingSet && nextPendingSet.weightKg) {
          setActivePlateTarget({
            weight: nextPendingSet.weightKg,
            barbell: nextPendingSet.barbellWeight,
            title: `${nextPendingSet.exerciseName} · Подход #${nextPendingSet.setNumber} (${nextPendingSet.effectivePct}%)`,
          });
          return;
        }
        for (const it of computedDayItems) {
          const firstWeighted = it.computedBlocks.find((b) => b.weightKg !== null);
          if (firstWeighted) {
            setActivePlateTarget({
              weight: firstWeighted.weightKg,
              barbell: firstWeighted.barbellWeight || 20,
              title: `${it.name} · ${firstWeighted.effectivePct}% × ${firstWeighted.reps} повт.`,
            });
            return;
          }
        }
        setActivePlateTarget(null);
      }, [nextPendingSet, computedDayItems]);

      const handleCompleteNextSet = () => {
        if (!nextPendingSet) return;
        NativeiOSBridge.haptic('heavy', iosSettings.hapticsEnabled);
        setCompletedSets((prev) => ({ ...prev, [nextPendingSet.setKey]: true }));
        if (nextPendingSet.isBase) {
          startTimer(nextPendingSet.effectivePct >= 88 ? 300 : 180);
        } else {
          startTimer(60);
        }
      };

      const toggleSet = (setKey, isBase, effectivePct = 0) => {
        NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        const nextVal = !completedSets[setKey];
        setCompletedSets((prev) => ({ ...prev, [setKey]: nextVal }));
        if (nextVal) {
          if (isBase) startTimer(effectivePct >= 88 ? 300 : 180);
          else startTimer(60);
        }
      };

      const handleUpdate1RM = (id, newVal) => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        const num = parseFloat(newVal);
        setExercises((prev) =>
          prev.map((ex) => {
            if (ex.id !== id) return ex;
            const cleanVal = isNaN(num) ? 0 : num;
            const today = new Date().toISOString().slice(0, 10);
            const updatedHistory = [...(ex.history || [])];
            if (cleanVal > 0) {
              const last = updatedHistory[updatedHistory.length - 1];
              if (last && last.date === today) last.weight = cleanVal;
              else updatedHistory.push({ date: today, weight: cleanVal });
            }
            return { ...ex, oneRepMax: cleanVal, history: updatedHistory };
          })
        );
      };

      const dayTonnage = useMemo(() => {
        let sum = 0;
        for (const s of flatDaySets) {
          if (s.done && s.weightKg) sum += s.weightKg * s.reps;
        }
        return Math.round(sum);
      }, [flatDaySets]);

      const filteredRecipes = useMemo(() => {
        if (recipeCategory === 'Все') return mealTemplates;
        return mealTemplates.filter((m) => m.category === recipeCategory);
      }, [mealTemplates, recipeCategory]);

      const fridgeMatchedRecipes = useMemo(() => {
        if (selectedFridgeItems.length === 0) return [];
        const activeKeywords = FRIDGE_PRODUCTS.filter((p) => selectedFridgeItems.includes(p.id)).flatMap((p) => p.keywords);
        return mealTemplates
          .map((meal) => {
            const text = (meal.name + ' ' + meal.ingredients).toLowerCase();
            let hits = 0;
            for (const kw of activeKeywords) {
              if (text.includes(kw)) hits++;
            }
            return { ...meal, hits };
          })
          .filter((m) => m.hits > 0)
          .sort((a, b) => b.hits - a.hits || b.p - a.p);
      }, [mealTemplates, selectedFridgeItems]);

      const toggleFridgeItem = (id) => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        setSelectedFridgeItems((prev) =>
          prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
        );
      };

      const addMealToLog = (meal, scale = 1) => {
        NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        const scaledMeal = {
          ...meal,
          name: scale === 1 ? meal.name : `${meal.name} (${scale}×)`,
          kcal: Math.round(meal.kcal * scale),
          p: Math.round(meal.p * scale),
          f: Math.round(meal.f * scale),
          c: Math.round(meal.c * scale),
          uid: Date.now() + Math.random(),
        };
        setNutritionLog((prev) => ({
          ...prev,
          entries: [...prev.entries, scaledMeal],
        }));
      };

      const toggleIngredientCheck = (recipeId, idx) => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        const k = `${recipeId}-${idx}`;
        setCheckedIngredients((prev) => ({ ...prev, [k]: !prev[k] }));
      };

      const nutritionTotals = useMemo(() => {
        return nutritionLog.entries.reduce(
          (acc, m) => ({
            kcal: acc.kcal + (Number(m.kcal) || 0),
            p: acc.p + (Number(m.p) || 0),
            f: acc.f + (Number(m.f) || 0),
            c: acc.c + (Number(m.c) || 0),
          }),
          { kcal: 0, p: 0, f: 0, c: 0 }
        );
      }, [nutritionLog.entries]);

      const targetKcal = nutritionLog.dayType === 'workout' ? 3000 : 2500;
      const targetProtein = Math.round((nutritionLog.bodyweight || 78) * 2.0);
      const bench1RM = exercises.find((e) => e.id === 'bench')?.oneRepMax || 0;

      const sbdTotal = useMemo(() => {
        const s = exercises.find((e) => e.id === 'squat')?.oneRepMax || 0;
        const b = exercises.find((e) => e.id === 'bench')?.oneRepMax || 0;
        const d = exercises.find((e) => e.id === 'deadlift')?.oneRepMax || 0;
        return Number((s + b + d).toFixed(1));
      }, [exercises]);

      const dotsScore = useMemo(
        () => calculateDOTS(sbdTotal, nutritionLog.bodyweight),
        [sbdTotal, nutritionLog.bodyweight]
      );

      const handleShareWorkout = async () => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        const lines = [
          `IRON CORE // ${activeProgram.title} · ${dayObj.title}`,
          `Тоннаж: ${dayTonnage} кг (${completedSetsCount}/${flatDaySets.length} подх.)`,
          ...computedDayItems.map((it, i) => {
            const desc = it.computedBlocks
              .map((b) => (b.weightKg ? `${b.weightKg}кг×${b.reps}×${b.sets}` : `${b.reps}×${b.sets}`))
              .join(', ');
            return `${i + 1}. ${it.name}: ${desc}`;
          }),
        ].join('\n');
        await NativeiOSBridge.shareText(`IRON CORE · ${activeProgram.title}`, lines);
      };

      const handleExportBackup = () => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        const payload = { programs, activeProgramId, programPositions, exercises, completedSets, mealTemplates, nutritionLog, iosSettings };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ironcore_full_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportBackup = async (file) => {
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (data.programs) setPrograms(data.programs);
          if (data.activeProgramId) setActiveProgramId(data.activeProgramId);
          if (data.programPositions) setProgramPositions(data.programPositions);
          if (data.exercises) setExercises(data.exercises);
          if (data.completedSets) setCompletedSets(data.completedSets);
          if (data.mealTemplates) setMealTemplates(data.mealTemplates);
          if (data.nutritionLog) setNutritionLog(data.nutritionLog);
          if (data.iosSettings) setIosSettings(data.iosSettings);
          NativeiOSBridge.haptic('heavy', iosSettings.hapticsEnabled);
          alert('Бэкап и все программы восстановлены!');
        } catch {
          alert('Ошибка чтения JSON.');
        }
      };

      return (
        <div className="bg-grid min-h-screen">
          {/* ================= DYNAMIC ISLAND BAR ================= */}
          <DynamicIslandBar
            expanded={islandExpanded}
            setExpanded={setIslandExpanded}
            activeProgramTitle={activeProgram.title}
            nextPendingSet={nextPendingSet}
            completedCount={completedSetsCount}
            totalCount={flatDaySets.length}
            timerSec={timerSec}
            timerTotal={timerTotal}
            timerRunning={timerRunning}
            startTimer={startTimer}
            stopTimer={stopTimer}
            onCompleteNext={handleCompleteNextSet}
            onOpenPrograms={() => { setProgramsSheetMode('list'); setIsProgramsSheetOpen(true); }}
            onOpenSettings={() => setIsSettingsSheetOpen(true)}
            isNativeApp={isNativeApp}
            shortcutsEnabled={iosSettings.shortcutsIslandEnabled}
            hapticsEnabled={iosSettings.hapticsEnabled}
          />

          <div className="max-w-5xl mx-auto px-4 pt-[calc(4.1rem+env(safe-area-inset-top))] sm:pt-20">
            {/* ================= HEADER ================= */}
            <header className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-borderSubtle">
              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-10 h-10 rounded-2xl bg-black border border-emerald-500/40 flex items-center justify-center shadow-lg shrink-0">
                    <span className="font-mono font-bold text-xs text-emerald-400">{activeProgram.badge}</span>
                  </div>
                  <div className="min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <h1 className="text-base font-semibold tracking-tight text-zinc-50">IRON CORE</h1>
                      <button
                        onClick={() => {
                          NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
                          setProgramsSheetMode('list');
                          setIsProgramsSheetOpen(true);
                        }}
                        className="px-2.5 py-0.5 text-[11px] font-medium bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 rounded-full flex items-center gap-1 truncate max-w-[190px] active:scale-95 transition-all"
                      >
                        <span className="truncate">{activeProgram.title}</span>
                        <span className="text-[9px] opacity-80">▾</span>
                      </button>
                    </div>
                    <p className="text-xs text-zinc-500 mt-0.5 truncate">
                      Программ: {programs.length} · Неделя {weekObj.week}/{activeProgram.weeks.length} · Жим {bench1RM} кг
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-1.5 shrink-0">
                  <button
                    onClick={handleShareWorkout}
                    className="w-9 h-9 rounded-xl bg-surface border border-borderSubtle text-zinc-300 flex items-center justify-center text-xs active:scale-95"
                    title="Поделиться тренировкой"
                  >
                    ↗
                  </button>
                  <button
                    onClick={() => { NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled); setIsSettingsSheetOpen(true); }}

                </button>
              </div>

              <div className="p-3.5 rounded-xl bg-[#0B0B0E] border border-zinc-800 flex items-center justify-between gap-3">
                <div>
                  <div className="font-semibold text-zinc-100">Не гасить экран (Wake Lock)</div>
                  <div className="text-[11px] text-zinc-500 mt-0.5">Держит экран активным между подходами и на кухне</div>
                </div>
                <button
                  onClick={() => {
                    NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
                    setIosSettings((s) => ({ ...s, wakeLockEnabled: !s.wakeLockEnabled }));
                  }}
                  className={`w-12 h-7 rounded-full p-1 transition-colors shrink-0 ${
                    iosSettings.wakeLockEnabled ? 'bg-emerald-500' : 'bg-zinc-700'
                  }`}
                >
                  <div className={`w-5 h-5 rounded-full bg-white transition-transform ${
                    iosSettings.wakeLockEnabled ? 'translate-x-5' : 'translate-x-0'
                  }`} />
                </button>
              </div>

              <div className="p-3.5 rounded-xl bg-[#0B0B0E] border border-sky-500/30 space-y-2.5">
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <div className="font-semibold text-sky-300">Системный Dynamic Island (Команды)</div>
                    <div className="text-[11px] text-zinc-400 mt-0.5">
                      Запускает родной таймер iPhone прямо в вырезе и на экране блокировки
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
                      setIosSettings((s) => ({ ...s, shortcutsIslandEnabled: !s.shortcutsIslandEnabled }));
                    }}
                    className={`w-12 h-7 rounded-full p-1 transition-colors shrink-0 ${
                      iosSettings.shortcutsIslandEnabled ? 'bg-sky-500' : 'bg-zinc-700'
                    }`}
                  >
                    <div className={`w-5 h-5 rounded-full bg-white transition-transform ${
                      iosSettings.shortcutsIslandEnabled ? 'translate-x-5' : 'translate-x-0'
                    }`} />
                  </button>
                </div>

                {iosSettings.shortcutsIslandEnabled && (
                  <div className="pt-2.5 border-t border-zinc-800 space-y-2">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-[11px] text-zinc-400">Имя команды в iOS:</span>
                      <input
                        type="text"
                        value={iosSettings.shortcutName}
                        onChange={(e) => setIosSettings((s) => ({ ...s, shortcutName: e.target.value }))}
                        className="w-36 bg-surface border border-zinc-700 rounded-lg px-2 py-1 font-mono text-xs text-zinc-100"
                      />
                    </div>
                    <button
                      onClick={() => NativeiOSBridge.triggerShortcutsDynamicIslandTimer(60, iosSettings.shortcutName)}
                      className="w-full py-2 rounded-lg bg-sky-500/20 border border-sky-500/40 text-sky-300 font-semibold"
                    >
                      Проверить таймер 60с в Dynamic Island ↗
                    </button>
                  </div>
                )}
              </div>
            </div>
          </BottomSheet>

          {/* ================= FLOATING ACTION BAR: «СЛЕДУЮЩИЙ ПОДХОД» ================= */}
          {activeTab === 'workout' && (
            <div className="fixed bottom-[calc(4.5rem+env(safe-area-inset-bottom))] left-0 right-0 px-4 z-40 pointer-events-none">
              <div className="max-w-xl mx-auto pointer-events-auto">
                <div className="ios-glass-card border border-zinc-700/80 rounded-2xl p-2.5 shadow-[0_14px_40px_rgba(0,0,0,0.85)] flex items-center justify-between gap-3">
                  {nextPendingSet ? (
                    <>
                      <div className="pl-2 min-w-0">
                        <div className="text-[10px] uppercase tracking-wider text-zinc-400 truncate">
                          {nextPendingSet.exerciseName}
                        </div>
                        <div className="font-mono tabular text-sm font-bold text-zinc-100 truncate">
                          {nextPendingSet.weightKg
                            ? `${nextPendingSet.weightKg} кг × ${nextPendingSet.reps} повт. (#${nextPendingSet.setNumber})`
                            : `${nextPendingSet.reps} повт. · Подход #${nextPendingSet.setNumber}`}
                        </div>
                      </div>
                      <button
                        onClick={handleCompleteNextSet}
                        className="shrink-0 px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 text-xs font-bold tracking-tight shadow-lg shadow-emerald-500/20 active:scale-95 transition-all"
                      >
                        Следующий подход ✓
                      </button>
                    </>
                  ) : (
                    <div className="w-full py-1.5 text-center text-xs font-semibold text-emerald-400">
                      🎉 Все подходы сегодняшней тренировки выполнены!
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================= FIXED iOS TAB BAR ================= */}
          <nav className="fixed bottom-0 left-0 right-0 ios-blur-bar border-t border-zinc-800/80 px-2 pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] z-50">
            <div className="max-w-xl mx-auto grid grid-cols-4 gap-1">
              {[
                { id: 'workout', label: 'Программы', icon: '🏋️' },
                { id: 'recipes', label: 'Рецепты', icon: '🥗' },
                { id: 'fridge', label: 'Холодильник', icon: '🧊' },
                { id: 'calc', label: 'Калькулятор', icon: '⚡' },
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => {
                    if (tab.id !== activeTab) {
                      NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
                      setActiveTab(tab.id);
                    }
                  }}
                  className={`py-1.5 rounded-xl flex flex-col items-center justify-center gap-0.5 transition-all active:scale-95 ${
                    activeTab === tab.id
                      ? 'bg-zinc-800/90 text-emerald-400 font-semibold'
                      : 'text-zinc-400 hover:text-zinc-200'
                  }`}
                >
                  <span className="text-sm leading-none">{tab.icon}</span>
                  <span className="text-[11px]">{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
