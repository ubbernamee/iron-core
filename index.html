  <style>
    :root {
      --spring-ios: cubic-bezier(0.22, 1, 0.36, 1);
      --spring-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --accent-rgb: 56, 189, 248;
      --accent-hex: #38BDF8;
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      background-color: #0B111E;
      color: #F8FAFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      overscroll-behavior-y: none;
    }
    body {
      background: #0B111E;
      padding-bottom: calc(9.8rem + env(safe-area-inset-bottom));
    }

    .tabular { font-variant-numeric: tabular-nums; }

    /* =================== LIVING AURORA MESH BACKDROP =================== */
    .aurora-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(120% 90% at 50% 0%, #14223D 0%, #0D1526 52%, #080D18 100%);
    }
    .aurora-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(78px);
      will-change: transform;
      transition: background 0.9s ease;
    }
    @keyframes orbDriftOne {
      0%, 100% { transform: translate3d(-8%, -6%, 0) scale(1); }
      50% { transform: translate3d(14%, 10%, 0) scale(1.14); }
    }
    @keyframes orbDriftTwo {
      0%, 100% { transform: translate3d(12%, 8%, 0) scale(1.06); }
      50% { transform: translate3d(-12%, -8%, 0) scale(0.94); }
    }
    @keyframes orbDriftThree {
      0%, 100% { transform: translate3d(0%, 12%, 0) scale(0.96); }
      50% { transform: translate3d(8%, -10%, 0) scale(1.12); }
    }
    .orb-1 { animation: orbDriftOne 15s ease-in-out infinite; }
    .orb-2 { animation: orbDriftTwo 19s ease-in-out infinite; }
    .orb-3 { animation: orbDriftThree 23s ease-in-out infinite; }

    /* =================== TRANSLUCENT COBALT SLATE GLASS =================== */
    .slate-card {
      background: linear-gradient(165deg, rgba(28, 41, 68, 0.72) 0%, rgba(17, 26, 46, 0.82) 100%);
      backdrop-filter: blur(22px) saturate(155%);
      -webkit-backdrop-filter: blur(22px) saturate(155%);
      border: 1px solid rgba(148, 179, 235, 0.14);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 18px 40px rgba(4, 8, 18, 0.55);
      transition: border-color 0.45s ease, box-shadow 0.45s ease, transform 0.25s var(--spring-ios);
    }
    .slate-card-active {
      border-color: rgba(var(--accent-rgb), 0.34);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        0 20px 44px rgba(4, 8, 18, 0.65),
        0 0 28px rgba(var(--accent-rgb), 0.12);
    }
    .slate-pill {
      background: rgba(25, 37, 62, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 179, 235, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .slate-well {
      background: rgba(10, 16, 29, 0.68);
      border: 1px solid rgba(148, 179, 235, 0.09);
      box-shadow: inset 0 2px 8px rgba(3, 6, 14, 0.65);
    }

    /* Main Stage Z-Depth Recede */
    .app-stage {
      position: relative;
      z-index: 10;
      transform-origin: top center;
      will-change: transform, filter, border-radius;
    }

    /* Dynamic Island Top Cap & Pill */
    .top-fade-cap {
      background: linear-gradient(180deg, rgba(10, 16, 29, 0.94) 0%, rgba(10, 16, 29, 0.6) 65%, rgba(10, 16, 29, 0) 100%);
    }
    .island-pill {
      background: rgba(11, 17, 31, 0.92);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(148, 179, 235, 0.22);
      box-shadow:
        0 16px 40px rgba(3, 6, 15, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      transition: all 0.4s var(--spring-ios);
    }
    .island-urgent {
      border-color: rgba(52, 211, 153, 0.6);
      box-shadow:
        0 16px 44px rgba(16, 185, 129, 0.32),
        inset 0 1px 0 rgba(110, 231, 183, 0.45);
    }

    /* Frosted Floating Bars */
    .ios-blur-bar {
      background: rgba(13, 21, 38, 0.84);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-top: 1px solid rgba(148, 179, 235, 0.14);
    }
    .ios-glass-card {
      background: rgba(20, 31, 54, 0.86);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(148, 179, 235, 0.2);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        0 18px 44px rgba(3, 6, 16, 0.78);
    }

    /* =================== MOTION CHOREOGRAPHY =================== */

    /* 1. Staggered Card Cascade Entrance */
    @keyframes cascadeReveal {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.965);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }
    .animate-cascade {
      opacity: 0;
      animation: cascadeReveal 0.48s var(--spring-ios) forwards;
    }

    /* 2. Spring Bottom Sheet */
    @keyframes sheetSpringUp {
      0% { transform: translateY(100%) scale(0.98); opacity: 0.7; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .animate-sheet-spring {
      animation: sheetSpringUp 0.38s var(--spring-ios) forwards;
    }

    /* 3. 3D Barbell Sequential IPF Plate Slide-On & Elastic Clamp */
    @keyframes plateSlideOn {
      0% {
        opacity: 0;
        transform: translateX(52px) scaleY(0.88);
      }
      65% {
        opacity: 1;
        transform: translateX(-4px) scaleY(1.03);
      }
      85% {
        transform: translateX(1.5px) scaleY(0.99);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scaleY(1);
      }
    }
    .animate-plate-load {
      opacity: 0;
      animation: plateSlideOn 0.48s var(--spring-elastic) forwards;
    }

    @keyframes collarClamp {
      0% {
        opacity: 0;
        transform: translateX(40px) scale(0.82);
      }
      70% {
        opacity: 1;
        transform: translateX(-2px) scale(1.06);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    .animate-collar-load {
      opacity: 0;
      animation: collarClamp 0.38s var(--spring-elastic) forwards;
    }

    @keyframes chromeSweep {
      0% { transform: translateX(-140%) skewX(-22deg); }
      100% { transform: translateX(360%) skewX(-22deg); }
    }
    .chrome-sheen {
      animation: chromeSweep 3.4s ease-in-out infinite;
    }

    /* 4. Liquid Set Button + Shockwave Ripple */
    .liquid-set-btn {
      position: relative;
      overflow: hidden;
      transition: transform 0.24s var(--spring-elastic), color 0.25s ease, border-color 0.25s ease, box-shadow 0.3s ease;
    }
    .liquid-set-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.34) 0%, rgba(56, 189, 248, 0.24) 100%);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.38s var(--spring-ios);
      z-index: 0;
    }
    .liquid-set-btn.is-done::before {
      transform: scaleX(1);
    }

    @keyframes shockwaveBurst {
      0% {
        transform: scale(0.25);
        opacity: 0.85;
      }
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }
    .set-shockwave {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.7) 0%, rgba(56, 189, 248, 0) 72%);
      pointer-events: none;
      animation: shockwaveBurst 0.55s var(--spring-ios) forwards;
      z-index: 1;
    }

    /* 5. Breathing Next-Set Beacon */
    @keyframes beaconPulse {
      0%, 100% {
        box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.65), 0 4px 16px rgba(var(--accent-rgb), 0.18);
      }
      50% {
        box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.95), 0 6px 24px rgba(var(--accent-rgb), 0.38);
      }
    }
    .next-set-beacon {
      animation: beaconPulse 2.2s ease-in-out infinite;
    }

    /* 6. Directional Day Transition */
    @keyframes daySlideNext {
      0% { opacity: 0.25; transform: translateX(26px) scale(0.985); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes daySlidePrev {
      0% { opacity: 0.25; transform: translateX(-26px) scale(0.985); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    .animate-day-next { animation: daySlideNext 0.36s var(--spring-ios) forwards; }
    .animate-day-prev { animation: daySlidePrev 0.36s var(--spring-ios) forwards; }

    /* 7. Celebratory Confetti Particles */
    @keyframes confettiFly {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--tx), var(--ty), 0) rotate(var(--rot)) scale(0.4);
      }
    }
    .confetti-dot {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 9999;
      animation: confettiFly 0.9s var(--spring-ios) forwards;
    }

    .magnetic-pill {
      transition: transform 0.38s var(--spring-ios);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 179, 235, 0.25); border-radius: 9999px; }
  </style>

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</head>
<body class="min-h-screen antialiased selection:bg-sky-400/30 selection:text-sky-100">
  <label id="ios-haptic-label" aria-hidden="true" style="position:fixed;left:-9999px;top:-9999px;opacity:0;pointer-events:none;">
    <input id="ios-haptic-switch" type="checkbox" switch />
  </label>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ============================================================================
    // 0. UNIFIED iOS NATIVE BRIDGE
    // ============================================================================
    const NativeiOSBridge = {
      isNativeCapacitor() {
        return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
      },
      getPlugin() {
        return window.Capacitor?.Plugins?.IronCoreLiveActivity || null;
      },
      haptic(style = 'medium', enabled = true) {
        if (!enabled) return;
        try {
          const plugin = this.getPlugin();
          if (plugin && plugin.triggerHaptic) {
            plugin.triggerHaptic({ style });
            return;
          }
          const lbl = document.getElementById('ios-haptic-label');
          if (lbl) lbl.click();
          if (navigator.vibrate) navigator.vibrate(style === 'heavy' ? 18 : style === 'light' ? 6 : 11);
        } catch {}
      },
      async syncLiveActivity(payload) {
        try {
          const plugin = this.getPlugin();
          if (plugin && plugin.startOrUpdateActivity) {
            await plugin.startOrUpdateActivity(payload);
            return true;
          }
        } catch {}
        return false;
      },
      async endLiveActivity() {
        try {
          const plugin = this.getPlugin();
          if (plugin && plugin.endActivity) await plugin.endActivity();
        } catch {}
      },
      triggerShortcutsDynamicIslandTimer(seconds, shortcutName = 'IronCoreTimer') {
        try {
          const encodedName = encodeURIComponent(shortcutName || 'IronCoreTimer');
          window.location.href = `shortcuts://run-shortcut?name=${encodedName}&input=text&text=${Math.round(seconds)}`;
        } catch {}
      },
      wakeLockSentinel: null,
      async setKeepAwake(enabled) {
        try {
          const plugin = this.getPlugin();
          if (plugin && plugin.setKeepAwake) {
            await plugin.setKeepAwake({ enabled });
            return true;
          }
          if ('wakeLock' in navigator) {
            if (enabled) {
              if (!this.wakeLockSentinel) {
                this.wakeLockSentinel = await navigator.wakeLock.request('screen');
                this.wakeLockSentinel.addEventListener('release', () => { this.wakeLockSentinel = null; });
              }
              return true;
            } else if (this.wakeLockSentinel) {
              await this.wakeLockSentinel.release();
              this.wakeLockSentinel = null;
            }
          }
        } catch {}
        return false;
      },
      async shareText(title, text) {
        if (navigator.share) {
          try { await navigator.share({ title, text }); return true; } catch { return false; }
        }
        try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
      },
      playChime() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const now = ctx.currentTime;
          [880, 1174.66].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.14);
            gain.gain.setValueAtTime(0.16, now + i * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.14 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.14);
            osc.stop(now + i * 0.14 + 0.36);
          });
        } catch {}
      },
    };

    // ============================================================================
    // 1. БАЗА 1ПМ, ПРОГРАММЫ, ШАБЛОНЫ И РЕЦЕПТЫ
    // ============================================================================
    const DEFAULT_EXERCISES = [
      {
        id: 'bench',
        name: 'Жим штанги лежа',
        shortName: 'Жим лежа',
        aliases: ['жим штанги лежа', 'жим лежа', 'жим на скамье', 'жим узким', 'жим средним', 'жим в слингшоте', 'жим с бруска', 'bench', 'жим'],
        oneRepMax: 90,
        barbellWeight: 20,
        step: 2.5,
        history: [{ date: '2026-11-19', weight: 90 }],
      },
      {
        id: 'squat',
        name: 'Приседания со штангой',
        shortName: 'Присед',
        aliases: ['приседания со штангой', 'фронтальный присед', 'приседания', 'присед', 'squat'],
        oneRepMax: 110,
        barbellWeight: 20,
        step: 2.5,
        history: [{ date: '2026-11-19', weight: 110 }],
      },
      {
        id: 'deadlift',
        name: 'Становая / Мертвая тяга',
        shortName: 'Становая',
        aliases: ['становая тяга', 'тяга становая', 'мертвая тяга', 'румынская тяга', 'сумо', 'становая', 'deadlift'],
        oneRepMax: 130,
        barbellWeight: 20,
        step: 2.5,
        history: [{ date: '2026-11-19', weight: 130 }],

    function matchExerciseId(lineLower) {
      let bestId = null;
      let bestLen = 0;
      for (const ex of DEFAULT_EXERCISES) {
        for (const al of ex.aliases) {
          if (lineLower.includes(al) && al.length > bestLen) {
            bestId = ex.id;
            bestLen = al.length;
          }
        }
      }
      return bestId;
    }

    function parseUniversalProgram(rawText) {
      const lines = rawText
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter(Boolean);

      const weeks = [];
      let currentWeek = null;
      let currentDay = null;

      const ensureWeek = (num, title) => {
        currentWeek = { week: num, title: title || `${num} НЕДЕЛЯ`, days: [] };
        weeks.push(currentWeek);
      };

      const ensureDay = (dayShort, title) => {
        if (!currentWeek) ensureWeek(1, '1 НЕДЕЛЯ');
        currentDay = {
          day: dayShort,
          title: title || `${currentWeek.week} Неделя · ${dayShort}`,
          items: [],
        };
        currentWeek.days.push(currentDay);
      };

      const weekRe = /^(?:неделя\s*(\d+)|(\d+)\s*неделя|week\s*(\d+))/i;
      const dayRe = /^(пн|вт|ср|чт|пт|сб|вс|понедельник|вторник|среда|четверг|пятница|суббота|воскресенье|день\s*\d+|day\s*\d+|тренировка\s*\d+)\b/i;

      const dayShortMap = {
        понедельник: 'Пн', вторник: 'Вт', среда: 'Ср', четверг: 'Чт',
        пятница: 'Пт', суббота: 'Сб', воскресенье: 'Вс',
        пн: 'Пн', вт: 'Вт', ср: 'Ср', чт: 'Чт', пт: 'Пт', сб: 'Сб', вс: 'Вс',
      };

      for (const rawLine of lines) {
        const line = rawLine.replace(/^[\d]+\.\s*/, '').trim();
        if (!line) continue;

        const wm = line.match(weekRe);
        if (wm && !line.includes('%') && !/\d+\s*[xх×]\s*\d+/i.test(line)) {
          const wNum = parseInt(wm[1] || wm[2] || wm[3], 10) || (weeks.length + 1);
          ensureWeek(wNum, line.replace(/[:\-–]+$/, '').trim());
          currentDay = null;
          continue;
        }

        const dm = line.match(dayRe);
        if (dm && !line.includes('%') && !/\d+\s*[xх×]\s*\d+/i.test(line)) {
          const key = dm[1].toLowerCase();
          const shortLabel = dayShortMap[key] || dm[1].replace(/день\s*/i, 'Д').replace(/day\s*/i, 'D').replace(/тренировка\s*/i, 'Т');
          if (!currentWeek) ensureWeek(1, '1 НЕДЕЛЯ');
          ensureDay(shortLabel, `${currentWeek.week} Неделя · ${line.replace(/[:\-–]+$/, '').trim()}`);
          continue;
        }

        if (!currentWeek) ensureWeek(1, '1 НЕДЕЛЯ');
        if (!currentDay) ensureDay('День 1', `${currentWeek.week} Неделя · День 1`);

        const tripleRe = /(\d+(?:[.,]\d+)?)\s*[xх×*]\s*(\d+)\s*[xх×*]\s*(\d+)/gi;
        const tripleMatches = [...line.matchAll(tripleRe)];

        let blocks = [];
        let cleanName = line;

        if (tripleMatches.length > 0) {
          blocks = tripleMatches.map((m) => ({
            pct: parseFloat(m[1].replace(',', '.')),
            reps: parseInt(m[2], 10),
            sets: parseInt(m[3], 10),
          }));
          cleanName = line.replace(tripleRe, '').replace(/[;:\-–]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
        } else {
          const multiWaveRe = /(\d+)\s*[xх×*]\s*(\d+)\s*@?\s*(\d+(?:[.,]\d+)?)\s*%/gi;
          const multiWaveMatches = [...line.matchAll(multiWaveRe)];

          if (multiWaveMatches.length > 0) {
            blocks = multiWaveMatches.map((m) => ({
              sets: parseInt(m[1], 10),
              reps: parseInt(m[2], 10),
              pct: parseFloat(m[3].replace(',', '.')),
            }));
            cleanName = line
              .replace(multiWaveRe, '')
              .replace(/\(?\s*rpe\s*\d+(?:[.,]\d+)?\s*\)?/gi, '')
              .replace(/[;:\-–@]+/g, ' ')
              .replace(/\s{2,}/g, ' ')
              .trim();
          } else {
            const srRe = /(\d+)\s*[xх×*]\s*(\d+)/i;
            const pctRe = /@?\s*(\d+(?:[.,]\d+)?)\s*%/;
            const srM = line.match(srRe);
            const pctM = line.match(pctRe);

            if (!srM && !pctM) continue;

            const sets = srM ? parseInt(srM[1], 10) : 3;
            const reps = srM ? parseInt(srM[2], 10) : 8;
            const pct = pctM ? parseFloat(pctM[1].replace(',', '.')) : 0;

            blocks = [{ pct, reps, sets }];
            cleanName = line
              .replace(srRe, '')
              .replace(pctRe, '')
              .replace(/\(?\s*rpe\s*\d+(?:[.,]\d+)?\s*\)?/gi, '')
              .replace(/[;:\-–@]+/g, ' ')
              .replace(/\s{2,}/g, ' ')
              .trim();
          }
        }

        if (!cleanName || cleanName.length < 2) continue;

        const exId = matchExerciseId(cleanName.toLowerCase());
        const hasPct = blocks.some((b) => b.pct > 0);
        const isBase = !!(exId && hasPct);

        currentDay.items.push({
          name: cleanName,
          exId: isBase ? exId : null,
          blocks,
          isBase,
          note: isBase ? 'Авторасчет от твоего 1ПМ' : 'Подсобка · вес индивидуально',
        });
      }

      const cleanedWeeks = weeks
        .map((w) => ({ ...w, days: w.days.filter((d) => d.items.length > 0) }))
        .filter((w) => w.days.length > 0);

      return cleanedWeeks.map((w, idx) => ({ ...w, week: idx + 1 }));
    }

    async function extractTextFromPdfArrayBuffer(arrayBuffer) {
      if (!window.pdfjsLib) throw new Error('PDF.js не загружен. Проверь интернет.');
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const linesOut = [];
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        const rows = [];
        for (const item of textContent.items) {
          const str = item.str.trim();
          if (!str) continue;
          const x = item.transform[4];
          const y = item.transform[5];
          let row = rows.find((r) => Math.abs(r.y - y) < 5);
          if (!row) {
            row = { y, tokens: [] };
            rows.push(row);
          }
          row.tokens.push({ x, str });
        }
        rows.sort((a, b) => b.y - a.y);
        for (const r of rows) {
          r.tokens.sort((a, b) => a.x - b.x);
          linesOut.push(r.tokens.map((t) => t.str).join(' '));
        }
      }
      return linesOut.join('\n');
    }

    function roundToStep(rawWeight, step = 2.5, minWeight = 20) {
      if (!rawWeight || isNaN(rawWeight)) return minWeight;
      const rounded = Math.round(rawWeight / step) * step;
      return Math.max(minWeight, Number(rounded.toFixed(2)));
    }

    function calculatePlatesPerSide(targetWeight, barbellWeight = 20) {
      if (targetWeight <= barbellWeight) return { plates: [], perSideKg: 0 };
      let remainingPerSide = Number(((targetWeight - barbellWeight) / 2).toFixed(3));
      const plates = [];
      for (const plate of PLATE_INVENTORY) {
        while (remainingPerSide >= plate.weight - 0.001) {
          plates.push(plate);
          remainingPerSide = Number((remainingPerSide - plate.weight).toFixed(3));
        }
      }
      return {
        plates,
        perSideKg: Number(((targetWeight - barbellWeight) / 2).toFixed(2)),
      };
    }

    function calculateE1RM(weight, reps) {
      if (!weight || !reps || reps <= 0) return 0;
      if (reps === 1) return weight;
      const epley = weight * (1 + reps / 30);
      const brzycki = reps < 37 ? weight * (36 / (37 - reps)) : epley;
      return Number(((epley + brzycki) / 2).toFixed(1));
    }

    function calculateDOTS(totalKg, bwKg) {
      if (!totalKg || !bwKg || bwKg < 40) return 0;
      const a = -0.000001093;
      const b = 0.0007391293;
      const c = -0.1918759221;
      const d = 24.0900756;
      const e = -307.75076;
      const denom = a * Math.pow(bwKg, 4) + b * Math.pow(bwKg, 3) + c * Math.pow(bwKg, 2) + d * bwKg + e;
      return denom > 0 ? Number(((totalKg * 500) / denom).toFixed(1)) : 0;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // ============================================================================
    // 4. ANIMATED MECHANICAL ROLLING NUMBER
    // ============================================================================
    function AnimatedNumber({ value, decimals = 0 }) {
      const numericTarget = Number(value) || 0;
      const [displayVal, setDisplayVal] = useState(numericTarget);
      const prevValRef = useRef(numericTarget);

      useEffect(() => {
        const startVal = prevValRef.current;
        const endVal = numericTarget;
        if (Math.abs(endVal - startVal) < 0.01) {
          setDisplayVal(endVal);
          prevValRef.current = endVal;
          return;
        }
        const duration = 320;
        const startTime = performance.now();
        let frameId;

        const tick = (now) => {
          const t = Math.min(1, (now - startTime) / duration);
          const easeOut = 1 - Math.pow(1 - t, 3);
          const current = startVal + (endVal - startVal) * easeOut;
          setDisplayVal(current);
          if (t < 1) {
            frameId = requestAnimationFrame(tick);
          } else {
            setDisplayVal(endVal);
            prevValRef.current = endVal;
          }
        };

        frameId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(frameId);
      }, [numericTarget]);

      if (decimals > 0) return <>{Number(displayVal.toFixed(decimals))}</>;
      const isHalf = Math.abs(numericTarget % 1) > 0.01;
      if (isHalf) return <>{(Math.round(displayVal * 4) / 4).toString()}</>;
      return <>{Math.round(displayVal)}</>;
    }

    // ============================================================================
    function BottomSheet({ isOpen, onClose, onDragProgress, title, subtitle, hapticsEnabled, children }) {
      const [dragY, setDragY] = useState(0);
      const startYRef = useRef(null);

      useEffect(() => {
        if (isOpen) {
          setDragY(0);
          if (onDragProgress) onDragProgress(0);
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
          if (onDragProgress) onDragProgress(1);
        }
        return () => { document.body.style.overflow = ''; };
      }, [isOpen]);

      if (!isOpen) return null;

      const handleTouchStart = (e) => { startYRef.current = e.touches[0].clientY; };
      const handleTouchMove = (e) => {
        if (startYRef.current === null) return;
        const delta = Math.max(0, e.touches[0].clientY - startYRef.current);
        setDragY(delta);
        if (onDragProgress) onDragProgress(Math.min(1, delta / 260));
      };
      const handleTouchEnd = () => {
        if (dragY > 105) {
          NativeiOSBridge.haptic('light', hapticsEnabled);
          onClose();
        } else {
          setDragY(0);
          if (onDragProgress) onDragProgress(0);
        }
        startYRef.current = null;
      };

      const backdropOpacity = Math.max(0, 0.72 * (1 - dragY / 320));

      return (
        <div
          onClick={() => { NativeiOSBridge.haptic('light', hapticsEnabled); onClose(); }}
          style={{
            backgroundColor: `rgba(5, 9, 18, ${backdropOpacity})`,
            transition: dragY === 0 ? 'background-color 0.34s var(--spring-ios)' : 'none',
          }}
          className="fixed inset-0 backdrop-blur-md z-50 flex items-end sm:items-center justify-center"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              transform: `translateY(${dragY}px)`,

        : totalCount > 0

        : 0;
      const isUrgent = timerRunning && timerSec > 0 && timerSec <= 10;
      const radius = 9;

            className={`pointer-events-auto island-pill cursor-pointer select-none overflow-hidden ${

    // 8. INTERACTIVE 3D TILT BARBELL & SEQUENTIAL IPF PLATE LOADER
    // ============================================================================
    function Barbell3DVisualizer({ targetWeight, barbellWeight = 20, title, hapticsEnabled }) {
      const [animSeed, setAnimSeed] = useState(0);
      const [tilt, setTilt] = useState({ rx: 0, ry: 0, gx: 0 });
      const cardRef = useRef(null);

      const { plates, perSideKg } = useMemo(
        () => calculatePlatesPerSide(targetWeight, barbellWeight),
        [targetWeight, barbellWeight]
      );

      useEffect(() => {
        setAnimSeed((s) => s + 1);
      }, [targetWeight, title]);

      // Gyroscope / DeviceOrientation parallax
      useEffect(() => {
        const onOrient = (e) => {
          if (typeof e.gamma === 'number' && typeof e.beta === 'number') {
            const ry = Math.max(-8, Math.min(8, e.gamma * 0.25));
            const rx = Math.max(-6, Math.min(6, (e.beta - 45) * 0.18));
            setTilt({ rx: -rx, ry, gx: ry * 4 });
          }
        };
        window.addEventListener('deviceorientation', onOrient, { passive: true });
        return () => window.removeEventListener('deviceorientation', onOrient);
      }, []);

      // Touch / Pointer 3D Tilt interaction
      const handlePointerMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const nx = (e.clientX - rect.left) / rect.width - 0.5;
        const ny = (e.clientY - rect.top) / rect.height - 0.5;
        setTilt({
          rx: Number((-ny * 10).toFixed(2)),
          ry: Number((nx * 12).toFixed(2)),
          gx: Number((nx * 60).toFixed(1)),
        });
      };

      const handlePointerLeave = () => {
        setTilt({ rx: 0, ry: 0, gx: 0 });
      };

      const handleReplayLoad = () => {
        NativeiOSBridge.haptic('medium', hapticsEnabled);
        setAnimSeed((s) => s + 1);
      };

      return (
        <div
          ref={cardRef}
          onClick={handleReplayLoad}
          onPointerMove={handlePointerMove}
          onPointerLeave={handlePointerLeave}
          style={{
            transform: `perspective(900px) rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg)`,
            transition: tilt.rx === 0 && tilt.ry === 0 ? 'transform 0.45s var(--spring-ios)' : 'transform 0.08s linear',
          }}
          className="slate-card slate-card-active rounded-[26px] p-4 relative overflow-hidden cursor-pointer select-none"
        >
          <div className="flex items-start justify-between gap-2 mb-3">
            <div className="min-w-0">
              <div className="inline-flex items-center gap-1.5 text-[10px] font-mono uppercase tracking-widest text-sky-300 font-semibold">
                <span className="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse" />
                3D Barbell · IPF Loader
              </div>
              <div className="text-sm font-semibold text-slate-50 mt-1 leading-snug truncate">{title}</div>
            </div>
            <div className="text-right shrink-0">
              <div className="font-mono tabular text-2xl font-extrabold text-sky-300 tracking-tight">
                <AnimatedNumber value={targetWeight} /> <span className="text-xs font-medium text-slate-400">кг</span>
              </div>
              <div className="font-mono tabular text-[11px] text-emerald-300/90">
                +<AnimatedNumber value={perSideKg} /> кг / сторона
              </div>
            </div>
          </div>

          <div className="relative h-36 slate-well rounded-2xl flex items-center justify-center overflow-hidden px-3 my-2">
            {/* Dynamic Studio Light Reflection */}
            <div
              style={{ transform: `translateX(${tilt.gx}px)` }}
              className="absolute -top-6 w-48 h-24 bg-sky-300/[0.11] blur-2xl rounded-full transition-transform duration-200 pointer-events-none"
            />
            <div className="absolute bottom-2 inset-x-12 h-3 bg-sky-400/15 blur-xl rounded-full pointer-events-none" />

            <div className="relative flex items-center">
              {/* Knurled Chrome Shaft */}
              <div className="w-14 h-2.5 bg-gradient-to-b from-slate-100 via-slate-400 to-slate-700 rounded-l-sm shadow-md relative overflow-hidden">
                <div className="absolute inset-y-0 left-2 right-2 opacity-35 bg-[repeating-linear-gradient(90deg,#000,#000_1px,transparent_1px,transparent_3px)]" />
                <div className="absolute inset-y-0 w-4 bg-white/60 chrome-sheen" />
              </div>

              {/* Inner Sleeve Shoulder */}
              <div className="w-3 h-9 bg-gradient-to-b from-slate-50 via-slate-300 to-slate-600 rounded-[2px] shadow-lg z-10" />

              {/* Loading Sleeve + Animated IPF Plates */}
              <div
                key={`${targetWeight}-${animSeed}`}
                className="relative flex items-center gap-[3px] pl-1 pr-9 min-w-[214px] h-28"
              >
                <div className="absolute left-0 right-2 h-4 bg-gradient-to-b from-slate-100 via-slate-400 to-slate-700 rounded-r-md shadow-inner z-0 overflow-hidden">
                  <div className="absolute inset-y-0 w-6 bg-white/45 chrome-sheen" />
                </div>

                {plates.length === 0 ? (
                  <span className="relative z-10 ml-4 px-3 py-1 rounded-lg bg-slate-900/90 border border-slate-700/60 font-mono text-[11px] text-slate-300">
                    Пустой гриф · {barbellWeight} кг
                  </span>
                ) : (
                  plates.map((plate, index) => (
                    <div
                      key={`${plate.weight}-${index}`}
                      style={{
                        height: `${plate.height}px`,
                        width: `${plate.width + 5}px`,
                        background: `linear-gradient(180deg, ${plate.color} 0%, ${plate.edge} 100%)`,
                        animationDelay: `${index * 60}ms`,
                      }}
                      className="animate-plate-load relative z-10 rounded-[3px] flex items-center justify-center shadow-[4px_6px_16px_rgba(3,7,18,0.8)]"
                    >
                      <div className="absolute inset-y-0 right-0 w-[3px] bg-black/35 rounded-r-[2px]" />
                      <div className="absolute inset-x-0 top-0 h-[24%] bg-white/35 rounded-t-[2px]" />
                      <span
                        style={{ color: plate.weight === 5 || plate.weight === 1.25 ? '#0F172A' : '#FFFFFF' }}
                        className="font-mono text-[9px] font-extrabold -rotate-90 select-none z-10"
                      >
                        {plate.label}
                      </span>
                    </div>
                  ))
                )}

                {plates.length > 0 && (
                  <div
                    style={{ animationDelay: `${plates.length * 60 + 35}ms` }}
                    className="animate-collar-load relative z-10 w-3.5 h-7 bg-gradient-to-b from-slate-50 via-slate-300 to-slate-600 rounded-[2px] ml-1 shadow-lg"
                    title="Замок IPF"
                  />
                )}
              </div>
            </div>
          </div>

          <div className="flex items-center justify-between pt-2 text-xs">
            <span className="text-slate-400">Сборка стороны (тап — повторить):</span>
            <span className="font-mono tabular font-semibold text-slate-100">
              {plates.length === 0 ? 'Только гриф (20 кг)' : plates.map((p) => `[${p.label}]`).join(' + ')}
            </span>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 9. MAIN APPLICATION (IRON CORE v8.0 · COBALT MOTION OS)
    // ============================================================================
    function App() {
      const isNativeApp = NativeiOSBridge.isNativeCapacitor();

      const savedSession = useMemo(() => {
        try {
          const raw =
            localStorage.getItem('ironcore_v8_session') ||
            localStorage.getItem('ironcore_v7_session') ||
            localStorage.getItem('ironcore_v6_session') ||
            localStorage.getItem('ironcore_v5_session');
          return raw ? JSON.parse(raw) : {};
        } catch {
          return {};
        }
      }, []);

      const [programs, setPrograms] = useState(() => {
        try {
          const saved = localStorage.getItem('ironcore_v6_programs');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              const existingIds = new Set(parsed.map((p) => p.id));
              const merged = [...parsed];
              for (const bp of DEFAULT_PROGRAMS) {
                if (!existingIds.has(bp.id)) merged.push(bp);
              }
              return merged;
            }
          }
          return DEFAULT_PROGRAMS;
        } catch {
          return DEFAULT_PROGRAMS;
        }
      });

      const [activeProgramId, setActiveProgramId] = useState(savedSession.activeProgramId || 'path-100kg');
      const [programPositions, setProgramPositions] = useState(
        savedSession.programPositions || {
          'path-100kg': {
            week: savedSession.selectedWeek || 1,
            dayIdx: savedSession.selectedDayIdx || 0,
          },
        }
      );

      const [exercises, setExercises] = useState(() => {
        try {
          const saved = localStorage.getItem('ironcore_v5_ex') || localStorage.getItem('ironcore_ios_v5_ex');
          return saved ? JSON.parse(saved) : DEFAULT_EXERCISES;
        } catch {
          return DEFAULT_EXERCISES;
        }
      });

      const [completedSets, setCompletedSets] = useState(() => {
        try {
          const saved = localStorage.getItem('ironcore_v5_done') || localStorage.getItem('ironcore_ios_v5_done');
          return saved ? JSON.parse(saved) : {};
        } catch {
          return {};
        }
      });

      const [mealTemplates, setMealTemplates] = useState(() => {
        try {
          const saved = localStorage.getItem('ironcore_v5_meals');
          return saved ? JSON.parse(saved) : DEFAULT_MEAL_TEMPLATES;
        } catch {
          return DEFAULT_MEAL_TEMPLATES;
        }
      });

      const [nutritionLog, setNutritionLog] = useState(() => {
        try {
          const saved = localStorage.getItem('ironcore_v5_nutr') || localStorage.getItem('ironcore_ios_v5_nutr');
          return saved
            ? JSON.parse(saved)
            : { bodyweight: 78.0, dayType: 'workout', entries: [DEFAULT_MEAL_TEMPLATES[0]] };
        } catch {
          return { bodyweight: 78.0, dayType: 'workout', entries: [] };
        }
      });

      const [iosSettings, setIosSettings] = useState(() => ({
        hapticsEnabled: savedSession.iosSettings?.hapticsEnabled ?? true,
        wakeLockEnabled: savedSession.iosSettings?.wakeLockEnabled ?? true,
        shortcutsIslandEnabled: savedSession.iosSettings?.shortcutsIslandEnabled ?? false,
        shortcutName: savedSession.iosSettings?.shortcutName || 'IronCoreTimer',
      }));

      const [activeTab, setActiveTab] = useState(savedSession.activeTab || 'workout');
      const [readinessShift, setReadinessShift] = useState(savedSession.readinessShift || 0);
      const [recipeCategory, setRecipeCategory] = useState(savedSession.recipeCategory || 'Все');
      const [checkedIngredients, setCheckedIngredients] = useState(savedSession.checkedIngredients || {});
      const [selectedFridgeItems, setSelectedFridgeItems] = useState(
        savedSession.selectedFridgeItems || ['творог', 'яйц', 'курин']
      );

      // Sheets & Z-Depth Recede State
      const [islandExpanded, setIslandExpanded] = useState(false);
      const [activePlateTarget, setActivePlateTarget] = useState(null);
      const [activeRecipeSheet, setActiveRecipeSheet] = useState(null);
      const [recipePortionScale, setRecipePortionScale] = useState(1);
      const [isFilterSheetOpen, setIsFilterSheetOpen] = useState(false);
      const [isSettingsSheetOpen, setIsSettingsSheetOpen] = useState(false);
      const [isProgramsSheetOpen, setIsProgramsSheetOpen] = useState(false);
      const [programsSheetMode, setProgramsSheetMode] = useState('list');
      const [sheetDragRatio, setSheetDragRatio] = useState(1);

      // Shockwave set feedback + Day transition direction
      const [recentBurstSetKey, setRecentBurstSetKey] = useState(null);
      const [dayTransitionDir, setDayTransitionDir] = useState('next');
      const swipeStartXRef = useRef(null);
      const swipeStartYRef = useRef(null);

      // Add Program state
      const [newProgTitle, setNewProgTitle] = useState('');
      const [newProgBadge, setNewProgBadge] = useState('NEW');
      const [newProgRawText, setNewProgRawText] = useState('');
      const [pdfImportStatus, setPdfImportStatus] = useState('');
      const pdfFileInputRef = useRef(null);

      // Timer
      const initialRemaining = savedSession.timerEndTime
        ? Math.max(0, Math.round((savedSession.timerEndTime - Date.now()) / 1000))
        : 0;
      const [timerEndTime, setTimerEndTime] = useState(initialRemaining > 0 ? savedSession.timerEndTime : null);
      const [timerSec, setTimerSec] = useState(initialRemaining);
      const [timerTotal, setTimerTotal] = useState(savedSession.timerTotal || 180);
      const [timerRunning, setTimerRunning] = useState(initialRemaining > 0);

      // e1RM Quick Calc
      const [calcExId, setCalcExId] = useState('bench');
      const [calcWeight, setCalcWeight] = useState(85);
      const [calcReps, setCalcReps] = useState(5);

      const importJsonRef = useRef(null);
      const currentTheme = TAB_THEMES[activeTab] || TAB_THEMES.workout;

      // Sync CSS accent variables with active tab atmosphere
      useEffect(() => {
        document.documentElement.style.setProperty('--accent-rgb', currentTheme.accentRgb);
        document.documentElement.style.setProperty('--accent-hex', currentTheme.accentHex);
      }, [currentTheme]);

      const isAnySheetOpen =
        isProgramsSheetOpen || !!activeRecipeSheet || isFilterSheetOpen || isSettingsSheetOpen;

      useEffect(() => {
        if (isAnySheetOpen) setSheetDragRatio(0);
        else setSheetDragRatio(1);
      }, [isAnySheetOpen]);

      const activeProgram = useMemo(
        () => programs.find((p) => p.id === activeProgramId) || programs[0],
        [programs, activeProgramId]
      );

      const currentPos = programPositions[activeProgram.id] || { week: 1, dayIdx: 0 };
      const selectedWeek = currentPos.week;
      const selectedDayIdx = currentPos.dayIdx;

      const setSelectedWeek = (weekNum) => {
        setDayTransitionDir(weekNum >= selectedWeek ? 'next' : 'prev');
        setProgramPositions((prev) => ({
          ...prev,
          [activeProgram.id]: { week: weekNum, dayIdx: 0 },
        }));
      };

      const setSelectedDayIdx = (dayIdx) => {
        setDayTransitionDir(dayIdx >= selectedDayIdx ? 'next' : 'prev');
        setProgramPositions((prev) => ({
          ...prev,
          [activeProgram.id]: { ...(prev[activeProgram.id] || { week: 1 }), dayIdx },
        }));
      };

      const handleSwitchProgram = (progId) => {
        NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        setActiveProgramId(progId);
        setActiveTab('workout');
        setIsProgramsSheetOpen(false);
      };

      const parsedNewProgramWeeks = useMemo(() => {
        if (!newProgRawText.trim()) return [];
        return parseUniversalProgram(newProgRawText);
      }, [newProgRawText]);

      const parsedNewStats = useMemo(() => {
        const wCount = parsedNewProgramWeeks.length;
        const dCount = parsedNewProgramWeeks.reduce((s, w) => s + w.days.length, 0);
        const exCount = parsedNewProgramWeeks.reduce(
          (s, w) => s + w.days.reduce((sd, d) => sd + d.items.length, 0),
          0
        );
        return { wCount, dCount, exCount };
      }, [parsedNewProgramWeeks]);

      const handlePdfProgramUpload = async (file) => {
        if (!file) return;
        setPdfImportStatus('Читаем PDF...');
        try {
          const buf = await file.arrayBuffer();
          const txt = await extractTextFromPdfArrayBuffer(buf);
          if (!txt.trim()) {
            setPdfImportStatus('В PDF нет текстового слоя (возможно, скан-картинка). Вставь текст ниже.');
            return;
          }
          setNewProgRawText(txt);
          if (!newProgTitle.trim()) {
            setNewProgTitle(file.name.replace(/\.pdf$/i, '').slice(0, 28));
          }
          setPdfImportStatus(`Загружен: ${file.name}`);
          NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        } catch (err) {
          setPdfImportStatus('Ошибка PDF: ' + err.message);
        }
      };

      const handleSaveNewProgram = () => {
        if (parsedNewProgramWeeks.length === 0) return;
        const id = `prog-${Date.now()}`;
        const title = newProgTitle.trim() || `Программа #${programs.length + 1}`;
        const badge = (newProgBadge.trim() || `${parsedNewStats.wCount} НЕД`).slice(0, 8).toUpperCase();
        const newProg = {
          id,
          title,
          badge,
          description: `${parsedNewStats.wCount} нед. · ${parsedNewStats.dCount} трен. дней`,
          isBuiltIn: false,
          weeks: parsedNewProgramWeeks,
        };
        setPrograms((prev) => [...prev, newProg]);
        setProgramPositions((prev) => ({ ...prev, [id]: { week: 1, dayIdx: 0 } }));
        setActiveProgramId(id);
        setActiveTab('workout');
        setNewProgTitle('');
        setNewProgBadge('NEW');
        setNewProgRawText('');
        setPdfImportStatus('');
        setProgramsSheetMode('list');
        setIsProgramsSheetOpen(false);
        NativeiOSBridge.haptic('heavy', iosSettings.hapticsEnabled);
      };

      const handleDeleteProgram = (progId) => {
        const target = programs.find((p) => p.id === progId);
        if (!target || target.isBuiltIn) return;
        if (!confirm(`Удалить программу «${target.title}»?`)) return;
        NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        setPrograms((prev) => prev.filter((p) => p.id !== progId));
        if (activeProgramId === progId) setActiveProgramId('path-100kg');
      };

      // Persist data
      useEffect(() => { localStorage.setItem('ironcore_v6_programs', JSON.stringify(programs)); }, [programs]);
      useEffect(() => { localStorage.setItem('ironcore_v5_ex', JSON.stringify(exercises)); }, [exercises]);
      useEffect(() => { localStorage.setItem('ironcore_v5_done', JSON.stringify(completedSets)); }, [completedSets]);
      useEffect(() => { localStorage.setItem('ironcore_v5_meals', JSON.stringify(mealTemplates)); }, [mealTemplates]);
      useEffect(() => { localStorage.setItem('ironcore_v5_nutr', JSON.stringify(nutritionLog)); }, [nutritionLog]);

      useEffect(() => {
        try {
          localStorage.setItem(
            'ironcore_v8_session',
            JSON.stringify({
              activeTab,
              activeProgramId,
              programPositions,
              readinessShift,
              recipeCategory,
              checkedIngredients,
              selectedFridgeItems,
              timerEndTime,
              timerTotal,
              iosSettings,
            })
          );
        } catch {}
      }, [
        activeTab,
        activeProgramId,
        programPositions,
        readinessShift,
        recipeCategory,
        checkedIngredients,
        selectedFridgeItems,
        timerEndTime,
        timerTotal,
        iosSettings,
      ]);

      useEffect(() => {
        NativeiOSBridge.setKeepAwake(iosSettings.wakeLockEnabled);
        const onVisibility = () => {
          if (document.visibilityState === 'visible' && iosSettings.wakeLockEnabled) {
            NativeiOSBridge.setKeepAwake(true);
          }
        };
        document.addEventListener('visibilitychange', onVisibility);
        return () => {
          document.removeEventListener('visibilitychange', onVisibility);
          NativeiOSBridge.setKeepAwake(false);
        };
      }, [iosSettings.wakeLockEnabled]);

      useEffect(() => {
        const savedScroll = parseInt(localStorage.getItem('ironcore_v5_scroll') || '0', 10);
        if (savedScroll > 0) requestAnimationFrame(() => window.scrollTo(0, savedScroll));
        let t;
        const onScroll = () => {
          clearTimeout(t);
          t = setTimeout(() => { localStorage.setItem('ironcore_v5_scroll', String(window.scrollY)); }, 140);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => { window.removeEventListener('scroll', onScroll); clearTimeout(t); };
      }, []);

      const weekObj = useMemo(
        () => activeProgram.weeks.find((w) => w.week === selectedWeek) || activeProgram.weeks[0],
        [activeProgram, selectedWeek]
      );
      const dayObj = weekObj.days[selectedDayIdx] || weekObj.days[0];

      // Horizontal swipe on workout card
      const handleWorkoutTouchStart = (e) => {
        swipeStartXRef.current = e.touches[0].clientX;
        swipeStartYRef.current = e.touches[0].clientY;
      };
      const handleWorkoutTouchEnd = (e) => {
        if (swipeStartXRef.current === null || swipeStartYRef.current === null) return;
        const dx = e.changedTouches[0].clientX - swipeStartXRef.current;
        const dy = e.changedTouches[0].clientY - swipeStartYRef.current;
        swipeStartXRef.current = null;
        swipeStartYRef.current = null;
        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0 && selectedDayIdx < weekObj.days.length - 1) {
            NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
            setSelectedDayIdx(selectedDayIdx + 1);
          } else if (dx > 0 && selectedDayIdx > 0) {
            NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
            setSelectedDayIdx(selectedDayIdx - 1);
          }
        }
      };

      const progKeyPrefix = activeProgram.id === 'path-100kg' ? '' : `${activeProgram.id}-`;

      const computedDayItems = useMemo(() => {
        return dayObj.items.map((item, itemIdx) => {
          const ex = item.exId ? exercises.find((e) => e.id === item.exId) : null;
          const computedBlocks = item.blocks.map((b, bIdx) => {
            if (!ex || !b.pct || b.pct <= 0) {
              return {
                ...b,
                effectivePct: 0,
                weightKg: null,
                barbellWeight: 20,
                blockKey: `${progKeyPrefix}w${weekObj.week}-d${selectedDayIdx}-i${itemIdx}-b${bIdx}`,
              };
            }
            const effectivePct = Math.max(30, b.pct + readinessShift);
            const rawKg = (ex.oneRepMax * effectivePct) / 100;
            const weightKg = roundToStep(rawKg, ex.step, ex.barbellWeight);
            return {
              ...b,
              effectivePct,
              weightKg,
              barbellWeight: ex.barbellWeight,
              oneRepMax: ex.oneRepMax,
              blockKey: `${progKeyPrefix}w${weekObj.week}-d${selectedDayIdx}-i${itemIdx}-b${bIdx}`,
            };
          });
          return {
            ...item,
            exName: ex ? ex.name : item.name,
            oneRepMax: ex ? ex.oneRepMax : null,
            computedBlocks,
          };
        });
      }, [dayObj, exercises, readinessShift, progKeyPrefix, weekObj.week, selectedDayIdx]);

      const flatDaySets = useMemo(() => {
        const list = [];
        computedDayItems.forEach((item, itemIdx) => {
          item.computedBlocks.forEach((b) => {
            for (let sIdx = 0; sIdx < b.sets; sIdx++) {
              const setKey = `${b.blockKey}-s${sIdx}`;
              list.push({
                setKey,
                itemIdx,
                exerciseName: item.name,
                isBase: item.isBase,
                setNumber: sIdx + 1,
                totalSetsInBlock: b.sets,
                reps: b.reps,
                effectivePct: b.effectivePct,
                weightKg: b.weightKg,
                barbellWeight: b.barbellWeight || 20,
                done: !!completedSets[setKey],
              });
            }
          });
        });
        return list;
      }, [computedDayItems, completedSets]);

      const nextPendingSet = useMemo(() => flatDaySets.find((s) => !s.done) || null, [flatDaySets]);
      const completedSetsCount = useMemo(() => flatDaySets.filter((s) => s.done).length, [flatDaySets]);

      useEffect(() => {
        if (!isNativeApp) return;
        if (!nextPendingSet && !timerRunning) {
          NativeiOSBridge.endLiveActivity();
          return;
        }
        NativeiOSBridge.syncLiveActivity({
          exerciseName: nextPendingSet ? nextPendingSet.exerciseName : 'Тренировка завершена',
          weightKg: nextPendingSet?.weightKg || 0,
          reps: nextPendingSet?.reps || 0,
          setNumber: nextPendingSet?.setNumber || completedSetsCount,
          completedSets: completedSetsCount,
          totalSets: flatDaySets.length,
          timerEndTimestamp: timerRunning && timerEndTime ? Math.floor(timerEndTime / 1000) : 0,
          isResting: timerRunning,
        });
      }, [isNativeApp, nextPendingSet, completedSetsCount, flatDaySets.length, timerRunning, timerEndTime]);

      useEffect(() => {
        if (!timerRunning || !timerEndTime) return;
        const interval = setInterval(() => {
          const left = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
          setTimerSec(left);
          if (left <= 0) {
            setTimerRunning(false);
            setTimerEndTime(null);
            NativeiOSBridge.playChime();
            NativeiOSBridge.haptic('heavy', iosSettings.hapticsEnabled);
          }
        }, 400);
        return () => clearInterval(interval);
      }, [timerRunning, timerEndTime, iosSettings.hapticsEnabled]);

      const startTimer = useCallback((sec) => {
        NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        const end = Date.now() + sec * 1000;
        setTimerTotal(sec);
        setTimerEndTime(end);
        setTimerSec(sec);
        setTimerRunning(true);
        if (!isNativeApp && iosSettings.shortcutsIslandEnabled) {
          NativeiOSBridge.triggerShortcutsDynamicIslandTimer(sec, iosSettings.shortcutName);
        }
      }, [isNativeApp, iosSettings]);

      const stopTimer = useCallback(() => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        setTimerRunning(false);
        setTimerEndTime(null);
        setTimerSec(0);
      }, [iosSettings.hapticsEnabled]);

      useEffect(() => {
        if (nextPendingSet && nextPendingSet.weightKg) {
          setActivePlateTarget({
            weight: nextPendingSet.weightKg,
            barbell: nextPendingSet.barbellWeight,
            title: `${nextPendingSet.exerciseName} · Подход #${nextPendingSet.setNumber} (${nextPendingSet.effectivePct}%)`,
          });
          return;
        }
        for (const it of computedDayItems) {
          const firstWeighted = it.computedBlocks.find((b) => b.weightKg !== null);
          if (firstWeighted) {
            setActivePlateTarget({
              weight: firstWeighted.weightKg,
              barbell: firstWeighted.barbellWeight || 20,
              title: `${it.name} · ${firstWeighted.effectivePct}% × ${firstWeighted.reps} повт.`,
            });
            return;
          }
        }
        setActivePlateTarget(null);
      }, [nextPendingSet, computedDayItems]);

      const triggerSetShockwave = (key, willCompleteAll) => {
        setRecentBurstSetKey(key);
        setTimeout(() => setRecentBurstSetKey((prev) => (prev === key ? null : prev)), 600);
        if (willCompleteAll) {
          spawnCelebrationBurst();
        }
      };

      const handleCompleteNextSet = () => {
        if (!nextPendingSet) return;
        NativeiOSBridge.haptic('heavy', iosSettings.hapticsEnabled);
        const willCompleteAll = completedSetsCount + 1 === flatDaySets.length;
        triggerSetShockwave(nextPendingSet.setKey, willCompleteAll);
        setCompletedSets((prev) => ({ ...prev, [nextPendingSet.setKey]: true }));
        if (nextPendingSet.isBase) {
          startTimer(nextPendingSet.effectivePct >= 88 ? 300 : 180);
        } else {
          startTimer(60);
        }
      };

      const toggleSet = (setKey, isBase, effectivePct = 0) => {
        NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        const nextVal = !completedSets[setKey];
        setCompletedSets((prev) => ({ ...prev, [setKey]: nextVal }));
        if (nextVal) {
          const willCompleteAll = completedSetsCount + 1 === flatDaySets.length;
          triggerSetShockwave(setKey, willCompleteAll);
          if (isBase) startTimer(effectivePct >= 88 ? 300 : 180);
          else startTimer(60);
        }
      };

      const handleUpdate1RM = (id, newVal) => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        const num = parseFloat(newVal);
        setExercises((prev) =>
          prev.map((ex) => {
            if (ex.id !== id) return ex;
            const cleanVal = isNaN(num) ? 0 : num;
            const today = new Date().toISOString().slice(0, 10);
            const updatedHistory = [...(ex.history || [])];
            if (cleanVal > 0) {
              const last = updatedHistory[updatedHistory.length - 1];
              if (last && last.date === today) last.weight = cleanVal;
              else updatedHistory.push({ date: today, weight: cleanVal });
            }
            return { ...ex, oneRepMax: cleanVal, history: updatedHistory };
          })
        );
      };

      const dayTonnage = useMemo(() => {
        let sum = 0;
        for (const s of flatDaySets) {
          if (s.done && s.weightKg) sum += s.weightKg * s.reps;
        }
        return Math.round(sum);
      }, [flatDaySets]);

      const filteredRecipes = useMemo(() => {
        if (recipeCategory === 'Все') return mealTemplates;
        return mealTemplates.filter((m) => m.category === recipeCategory);
      }, [mealTemplates, recipeCategory]);

      const fridgeMatchedRecipes = useMemo(() => {
        if (selectedFridgeItems.length === 0) return [];
        const activeKeywords = FRIDGE_PRODUCTS.filter((p) => selectedFridgeItems.includes(p.id)).flatMap((p) => p.keywords);
        return mealTemplates
          .map((meal) => {
            const text = (meal.name + ' ' + meal.ingredients).toLowerCase();
            let hits = 0;
            for (const kw of activeKeywords) {
              if (text.includes(kw)) hits++;
            }
            return { ...meal, hits };
          })
          .filter((m) => m.hits > 0)
          .sort((a, b) => b.hits - a.hits || b.p - a.p);
      }, [mealTemplates, selectedFridgeItems]);

      const toggleFridgeItem = (id) => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        setSelectedFridgeItems((prev) =>
          prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
        );
      };

      const addMealToLog = (meal, scale = 1) => {
        NativeiOSBridge.haptic('medium', iosSettings.hapticsEnabled);
        const scaledMeal = {
          ...meal,
          name: scale === 1 ? meal.name : `${meal.name} (${scale}×)`,
          kcal: Math.round(meal.kcal * scale),
          p: Math.round(meal.p * scale),
          f: Math.round(meal.f * scale),
          c: Math.round(meal.c * scale),
          uid: Date.now() + Math.random(),
        };
        setNutritionLog((prev) => ({
          ...prev,
          entries: [...prev.entries, scaledMeal],
        }));
      };

      const toggleIngredientCheck = (recipeId, idx) => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        const k = `${recipeId}-${idx}`;
        setCheckedIngredients((prev) => ({ ...prev, [k]: !prev[k] }));
      };

      const nutritionTotals = useMemo(() => {
        return nutritionLog.entries.reduce(
          (acc, m) => ({
            kcal: acc.kcal + (Number(m.kcal) || 0),
            p: acc.p + (Number(m.p) || 0),
            f: acc.f + (Number(m.f) || 0),
            c: acc.c + (Number(m.c) || 0),
          }),
          { kcal: 0, p: 0, f: 0, c: 0 }
        );
      }, [nutritionLog.entries]);

      const targetKcal = nutritionLog.dayType === 'workout' ? 3000 : 2500;
      const targetProtein = Math.round((nutritionLog.bodyweight || 78) * 2.0);
      const bench1RM = exercises.find((e) => e.id === 'bench')?.oneRepMax || 0;

      const sbdTotal = useMemo(() => {
        const s = exercises.find((e) => e.id === 'squat')?.oneRepMax || 0;
        const b = exercises.find((e) => e.id === 'bench')?.oneRepMax || 0;
        const d = exercises.find((e) => e.id === 'deadlift')?.oneRepMax || 0;
        return Number((s + b + d).toFixed(1));
      }, [exercises]);

      const dotsScore = useMemo(
        () => calculateDOTS(sbdTotal, nutritionLog.bodyweight),
        [sbdTotal, nutritionLog.bodyweight]
      );

      const handleShareWorkout = async () => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        const lines = [
          `IRON CORE // ${activeProgram.title} · ${dayObj.title}`,
          `Тоннаж: ${dayTonnage} кг (${completedSetsCount}/${flatDaySets.length} подх.)`,
          ...computedDayItems.map((it, i) => {
            const desc = it.computedBlocks
              .map((b) => (b.weightKg ? `${b.weightKg}кг×${b.reps}×${b.sets}` : `${b.reps}×${b.sets}`))
              .join(', ');
            return `${i + 1}. ${it.name}: ${desc}`;
          }),
        ].join('\n');
        await NativeiOSBridge.shareText(`IRON CORE · ${activeProgram.title}`, lines);
      };

      const handleExportBackup = () => {
        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
        const payload = { programs, activeProgramId, programPositions, exercises, completedSets, mealTemplates, nutritionLog, iosSettings };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ironcore_full_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportBackup = async (file) => {
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (data.programs) setPrograms(data.programs);
          if (data.activeProgramId) setActiveProgramId(data.activeProgramId);
          if (data.programPositions) setProgramPositions(data.programPositions);
          if (data.exercises) setExercises(data.exercises);
          if (data.completedSets) setCompletedSets(data.completedSets);
          if (data.mealTemplates) setMealTemplates(data.mealTemplates);
          if (data.nutritionLog) setNutritionLog(data.nutritionLog);
          if (data.iosSettings) setIosSettings(data.iosSettings);
          NativeiOSBridge.haptic('heavy', iosSettings.hapticsEnabled);
          alert('Бэкап и все программы восстановлены!');
        } catch {
          alert('Ошибка чтения JSON.');
        }
      };

      const stageScale = isAnySheetOpen ? 0.952 + 0.048 * sheetDragRatio : 1;
      const stageTranslateY = isAnySheetOpen ? 8 * (1 - sheetDragRatio) : 0;
      const stageBrightness = isAnySheetOpen ? 0.68 + 0.32 * sheetDragRatio : 1;
      const stageRadius = isAnySheetOpen ? Math.round(28 * (1 - sheetDragRatio)) : 0;

      const tabsList = [
        { id: 'workout', label: 'Программы', icon: '🏋️' },
        { id: 'recipes', label: 'Рецепты', icon: '🥗' },
        { id: 'fridge', label: 'Холодильник', icon: '🧊' },
        { id: 'calc', label: 'Калькулятор', icon: '⚡' },
      ];
      const activeTabIdx = Math.max(0, tabsList.findIndex((t) => t.id === activeTab));

      const readinessOptions = [
        { label: '-5%', val: -5 },
        { label: '-2.5%', val: -2.5 },
        { label: '0% План', val: 0 },
        { label: '+2.5%', val: 2.5 },
      ];
      const activeReadinessIdx = Math.max(0, readinessOptions.findIndex((o) => o.val === readinessShift));

      return (
        <div className="min-h-screen relative">
          {/* ================= LIVING AURORA MESH BACKDROP ================= */}
          <LivingAuroraBackdrop activeTab={activeTab} timerRunning={timerRunning} />

          {/* ================= DYNAMIC ISLAND BAR ================= */}
          <DynamicIslandBar
            expanded={islandExpanded}
            setExpanded={setIslandExpanded}
            activeProgramTitle={activeProgram.title}
            nextPendingSet={nextPendingSet}
            completedCount={completedSetsCount}
            totalCount={flatDaySets.length}
            timerSec={timerSec}
            timerTotal={timerTotal}
            timerRunning={timerRunning}
            startTimer={startTimer}
            stopTimer={stopTimer}
            onCompleteNext={handleCompleteNextSet}
            onOpenPrograms={() => { setProgramsSheetMode('list'); setIsProgramsSheetOpen(true); }}
            onOpenSettings={() => setIsSettingsSheetOpen(true)}
            isNativeApp={isNativeApp}
            shortcutsEnabled={iosSettings.shortcutsIslandEnabled}
            hapticsEnabled={iosSettings.hapticsEnabled}
          />

          {/* ================= MAIN APP STAGE ================= */}
          <div
            style={{
              transform: `scale(${stageScale}) translateY(${stageTranslateY}px)`,
              filter: `brightness(${stageBrightness})`,
              borderRadius: `${stageRadius}px`,
              transition: sheetDragRatio === 0 || sheetDragRatio === 1
                ? 'transform 0.38s var(--spring-ios), filter 0.38s var(--spring-ios), border-radius 0.38s var(--spring-ios)'
                : 'none',
            }}
            className="app-stage max-w-5xl mx-auto px-4 pt-[calc(4.1rem+env(safe-area-inset-top))] sm:pt-20"
          >
            {/* ================= HEADER (COBALT SLATE) ================= */}
            <header className="animate-cascade flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4" style={{ animationDelay: '0ms' }}>
              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="w-10 h-10 rounded-2xl slate-card flex items-center justify-center shrink-0">
                    <span className={`font-mono font-extrabold text-[11px] tracking-tight ${currentTheme.accentText}`}>
                      {activeProgram.badge}
                    </span>
                  </div>
                  <div className="min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <h1 className="text-base font-bold tracking-tight text-slate-50">IRON CORE</h1>
                      <button
                        onClick={() => {
                          NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
                          setProgramsSheetMode('list');
                          setIsProgramsSheetOpen(true);
                        }}
                        className="px-2.5 py-0.5 text-[11px] font-medium slate-pill hover:bg-slate-800/80 text-slate-100 rounded-full flex items-center gap-1 truncate max-w-[195px] active:scale-95 transition-all"
                      >
                        <span className="truncate">{activeProgram.title}</span>
                        <span className="text-[9px] text-sky-300">▾</span>
                      </button>
                    </div>
                    <p className="text-xs text-slate-400 mt-0.5 truncate">
                      Циклов: {programs.length} · Неделя {weekObj.week}/{activeProgram.weeks.length} · Жим {bench1RM} кг
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-1.5 shrink-0">
                  <button
                    onClick={handleShareWorkout}
                    className="w-9 h-9 rounded-xl slate-pill text-slate-200 flex items-center justify-center text-xs active:scale-90 transition-transform"
                    title="Поделиться тренировкой"
                  >
                    ↗
                  </button>
                  <button
                    onClick={() => { NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled); setIsSettingsSheetOpen(true); }}
                    className="px-2.5 h-9 rounded-xl slate-pill text-slate-100 font-mono text-[11px] flex items-center gap-1 active:scale-90 transition-transform"
                  >
                    <span>iOS</span>
                    <span className={currentTheme.accentText}>⚙</span>
                  </button>
                </div>
              </div>

              {/* Быстрая панель 3-х 1ПМ + таймер */}
              <div className="flex items-center gap-2.5 flex-wrap">
                <div className="grid grid-cols-3 gap-2 flex-1 sm:flex-initial">
                  {exercises.map((ex) => (
                    <div
                      key={ex.id}
                      className="slate-pill rounded-xl px-3 py-1.5 transition-transform focus-within:scale-[1.03]"
                    >
                      <div className="text-[10px] text-slate-400 truncate">{ex.shortName}</div>
                      <div className="flex items-baseline gap-0.5">
                        <input
                          type="number"
                          step="2.5"
                          value={ex.oneRepMax || ''}
                          onChange={(e) => handleUpdate1RM(ex.id, e.target.value)}
                          className="w-12 bg-transparent font-mono tabular text-xs font-bold text-slate-50 focus:text-sky-300 focus:outline-none"
                        />
                        <span className="text-[9px] text-slate-400 font-mono">кг</span>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex items-center gap-1 slate-well rounded-xl p-1">
                  {[
                    { label: '60с', sec: 60 },
                    { label: '3м', sec: 180 },
                    { label: '5м', sec: 300 },
                  ].map((t) => (
                    <button
                      key={t.sec}
                      onClick={() => startTimer(t.sec)}
                      className="px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 font-mono text-[11px] text-slate-100 active:scale-90 transition-transform"
                    >
                      {t.label}
                    </button>
                  ))}
                </div>
              </div>
            </header>

            {/* ================= TAB 1: АКТИВНАЯ ПРОГРАММА ================= */}
            {activeTab === 'workout' && (
              <div className="space-y-4 mt-2">
                {/* Панель выбора программы + недель */}
                <div className="animate-cascade slate-card rounded-[26px] p-3.5 space-y-3" style={{ animationDelay: '55ms' }}>
                  <div className="flex items-center justify-between gap-2">
                    <button
                      onClick={() => {
                        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
                        setProgramsSheetMode('list');
                        setIsProgramsSheetOpen(true);
                      }}
                      className="flex items-center gap-2 min-w-0 text-left group"
                    >
                      <span className="text-xs font-bold text-slate-50 group-hover:text-sky-300 transition-colors truncate">
                        {activeProgram.title}
                      </span>
                      <span className="px-2 py-0.5 rounded-md bg-slate-800/80 text-[10px] font-mono text-sky-300 shrink-0">
                        Сменить ▾
                      </span>
                    </button>
                    <button
                      onClick={() => {
                        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
                        setProgramsSheetMode('add');
                        setIsProgramsSheetOpen(true);
                      }}
                      className="px-2.5 py-1 rounded-lg bg-sky-400/15 hover:bg-sky-400/25 border border-sky-400/30 text-sky-200 text-[11px] font-semibold shrink-0 active:scale-95 transition-transform"
                    >
                      + Программа
                    </button>
                  </div>

                  {/* Лента недель */}
                  <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                    {activeProgram.weeks.map((w) => {
                      const active = weekObj.week === w.week;
                      return (
                        <button
                          key={w.week}
                          onClick={() => {
                            NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
                            setSelectedWeek(w.week);
                          }}
                          className={`px-3.5 py-1.5 rounded-xl font-mono tabular text-xs font-semibold shrink-0 transition-all active:scale-95 ${
                            active
                              ? 'bg-sky-400 text-slate-950 font-bold shadow-lg shadow-sky-400/25'
                              : 'bg-slate-900/60 text-slate-400 hover:text-slate-100'
                          }`}
                        >
                          Нед {w.week}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                  <div className="lg:col-span-5 space-y-4">
                    <div className="animate-cascade slate-card rounded-[26px] p-4" style={{ animationDelay: '110ms' }}>
                      <div className="flex items-center justify-between mb-3">

                            ? `${nextPendingSet.weightKg} кг × ${nextPendingSet.reps} повт. (#${nextPendingSet.setNumber})`
                            : `${nextPendingSet.reps} повт. · Подход #${nextPendingSet.setNumber}`}
                        </div>
                      </div>
                      <button
                        onClick={handleCompleteNextSet}
                        className="shrink-0 px-4 py-2.5 rounded-xl bg-sky-400 hover:bg-sky-300 text-slate-950 text-xs font-extrabold tracking-tight shadow-lg shadow-sky-400/25 active:scale-90 transition-transform"
                      >
                        Следующий подход ✓
                      </button>
                    </>
                  ) : (
                    <div className="w-full py-1.5 text-center text-xs font-bold text-emerald-300">
                      Все подходы сегодняшней тренировки выполнены 🎉
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================= FIXED iOS TAB BAR WITH MAGNETIC SLIDING CAPSULE ================= */}
          <nav className="fixed bottom-0 left-0 right-0 ios-blur-bar px-2 pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] z-50">
            <div className="relative max-w-xl mx-auto grid grid-cols-4">
              <div
                style={{
                  width: '25%',
                  transform: `translateX(${activeTabIdx * 100}%)`,
                }}
                className="magnetic-pill absolute inset-y-0 left-0 px-1 pointer-events-none"
              >
                <div className="w-full h-full rounded-2xl bg-slate-800/90 border border-slate-400/15 shadow-inner" />
              </div>

              {tabsList.map((tab) => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => {
                      if (tab.id !== activeTab) {
                        NativeiOSBridge.haptic('light', iosSettings.hapticsEnabled);
                        setActiveTab(tab.id);
                      }
                    }}
                    className={`relative z-10 py-1.5 rounded-2xl flex flex-col items-center justify-center gap-0.5 transition-colors active:scale-95 ${
                      isActive ? 'text-slate-50 font-semibold' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <span className="text-sm leading-none">{tab.icon}</span>
                    <span className="text-[11px]">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
