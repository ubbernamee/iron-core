    // 2. МАТЕМАТИКА ШТАНГИ, БЛИНОВ IPF, e1RM И DOTS
    // ============================================================================
    function roundToStep(rawWeight, step = 2.5, minWeight = 20) {
      if (!rawWeight || isNaN(rawWeight)) return minWeight;
      const rounded = Math.round(rawWeight / step) * step;
      return Math.max(minWeight, Number(rounded.toFixed(2)));
    }

    function calculatePlatesPerSide(targetWeight, barbellWeight = 20) {
      if (targetWeight <= barbellWeight) {
        return { plates: [], perSideKg: 0 };
      }
      let remainingPerSide = Number(((targetWeight - barbellWeight) / 2).toFixed(3));
      const plates = [];

      for (const plate of PLATE_INVENTORY) {
        while (remainingPerSide >= plate.weight - 0.001) {
          plates.push(plate);
          remainingPerSide = Number((remainingPerSide - plate.weight).toFixed(3));
        }
      }
      return {
        plates,
        perSideKg: Number(((targetWeight - barbellWeight) / 2).toFixed(2)),
      };
    }

    function calculateE1RM(weight, reps) {
      if (!weight || !reps || reps <= 0) return 0;
      if (reps === 1) return weight;
      const epley = weight * (1 + reps / 30);
      const brzycki = reps < 37 ? weight * (36 / (37 - reps)) : epley;
      return Number(((epley + brzycki) / 2).toFixed(1));
    }

    function calculateDOTS(totalKg, bwKg) {
      if (!totalKg || !bwKg || bwKg < 40) return 0;
      const a = -0.000001093;
      const b = 0.0007391293;
      const c = -0.1918759221;
      const d = 24.0900756;
      const e = -307.75076;
      const denom = a * Math.pow(bwKg, 4) + b * Math.pow(bwKg, 3) + c * Math.pow(bwKg, 2) + d * bwKg + e;
      return denom > 0 ? Number(((totalKg * 500) / denom).toFixed(1)) : 0;
    }

    function playTimerBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.36);
      } catch {}
    }

      useEffect(() => { localStorage.setItem('ironcore_100kg_v4_meals', JSON.stringify(mealTemplates)); }, [mealTemplates]);
      useEffect(() => { localStorage.setItem('ironcore_100kg_v4_nutr', JSON.stringify(nutritionLog)); }, [nutritionLog]);

      useEffect(() => {
        if (!timerRunning) return;
        const interval = setInterval(() => {
          setTimerSec((prev) => {
            if (prev <= 1) {
              setTimerRunning(false);
              playTimerBeep();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [timerRunning]);

      const startTimer = (sec) => {
        setTimerTotal(sec);
        setTimerSec(sec);
        setTimerRunning(true);
      };

      const formatTime = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const weekObj = useMemo(
        () => BUILTIN_13_WEEKS.find((w) => w.week === selectedWeek) || BUILTIN_13_WEEKS[0],
        [selectedWeek]
      );

      const dayObj = weekObj.days[selectedDayIdx] || weekObj.days[0];

      const computedDayItems = useMemo(() => {
        return dayObj.items.map((item, itemIdx) => {
          const ex = item.exId ? exercises.find((e) => e.id === item.exId) : null;
          const computedBlocks = item.blocks.map((b, bIdx) => {
            if (!ex || !b.pct || b.pct <= 0) {
              return {
                ...b,
                effectivePct: 0,
                weightKg: null,
                barbellWeight: 20,
                blockKey: `w${selectedWeek}-d${selectedDayIdx}-i${itemIdx}-b${bIdx}`,
              };
            }
            const effectivePct = Math.max(30, b.pct + readinessShift);
            const rawKg = (ex.oneRepMax * effectivePct) / 100;
            const weightKg = roundToStep(rawKg, ex.step, ex.barbellWeight);
            return {
              ...b,
              effectivePct,
              weightKg,
              barbellWeight: ex.barbellWeight,
              oneRepMax: ex.oneRepMax,
              blockKey: `w${selectedWeek}-d${selectedDayIdx}-i${itemIdx}-b${bIdx}`,
            };
          });

          return {
            ...item,
            exName: ex ? ex.name : item.name,
            oneRepMax: ex ? ex.oneRepMax : null,
            computedBlocks,
          };
        });
      }, [dayObj, exercises, readinessShift, selectedWeek, selectedDayIdx]);

      const flatDaySets = useMemo(() => {
        const list = [];
        computedDayItems.forEach((item, itemIdx) => {
          item.computedBlocks.forEach((b) => {
            for (let sIdx = 0; sIdx < b.sets; sIdx++) {
              const setKey = `${b.blockKey}-s${sIdx}`;
              list.push({
                setKey,
                itemIdx,
                exerciseName: item.name,
                isBase: item.isBase,
                setNumber: sIdx + 1,
                totalSetsInBlock: b.sets,
                reps: b.reps,
                effectivePct: b.effectivePct,
                weightKg: b.weightKg,
                barbellWeight: b.barbellWeight || 20,
                done: !!completedSets[setKey],
              });
            }
          });
        });
        return list;
      }, [computedDayItems, completedSets]);

      const nextPendingSet = useMemo(
        () => flatDaySets.find((s) => !s.done) || null,
        [flatDaySets]
      );

      const completedSetsCount = useMemo(
        () => flatDaySets.filter((s) => s.done).length,
        [flatDaySets]
      );

      useEffect(() => {
        if (nextPendingSet && nextPendingSet.weightKg) {
          setActivePlateTarget({
            weight: nextPendingSet.weightKg,
            barbell: nextPendingSet.barbellWeight,
            title: `${nextPendingSet.exerciseName} · Подход #${nextPendingSet.setNumber} (${nextPendingSet.effectivePct}%)`,
          });
          return;
        }
        for (const it of computedDayItems) {
          const firstWeighted = it.computedBlocks.find((b) => b.weightKg !== null);
          if (firstWeighted) {
            setActivePlateTarget({
              weight: firstWeighted.weightKg,
              barbell: firstWeighted.barbellWeight || 20,
              title: `${it.name} · ${firstWeighted.effectivePct}% × ${firstWeighted.reps} повт.`,
            });
            return;
          }
        }
        setActivePlateTarget(null);
      }, [nextPendingSet, computedDayItems]);

      const handleCompleteNextSet = () => {
        if (!nextPendingSet) return;
        setCompletedSets((prev) => ({ ...prev, [nextPendingSet.setKey]: true }));
        if (nextPendingSet.isBase) {
          startTimer(nextPendingSet.effectivePct >= 88 ? 300 : 180);
        } else {
          startTimer(60);
        }
      };

      const toggleSet = (setKey, isBase, effectivePct = 0) => {
        const nextVal = !completedSets[setKey];
        setCompletedSets((prev) => ({ ...prev, [setKey]: nextVal }));
        if (nextVal) {
          if (isBase) startTimer(effectivePct >= 88 ? 300 : 180);
          else startTimer(60);
        }
      };

      const handleUpdate1RM = (id, newVal) => {
        const num = parseFloat(newVal);
        setExercises((prev) =>
          prev.map((ex) => {
            if (ex.id !== id) return ex;
            const cleanVal = isNaN(num) ? 0 : num;
            const today = new Date().toISOString().slice(0, 10);
            const updatedHistory = [...(ex.history || [])];
            if (cleanVal > 0) {
              const last = updatedHistory[updatedHistory.length - 1];
              if (last && last.date === today) last.weight = cleanVal;
              else updatedHistory.push({ date: today, weight: cleanVal });
            }
            return { ...ex, oneRepMax: cleanVal, history: updatedHistory };
          })
        );
      };

      const dayTonnage = useMemo(() => {
        let sum = 0;
        for (const s of flatDaySets) {
          if (s.done && s.weightKg) sum += s.weightKg * s.reps;
        }
        return Math.round(sum);
      }, [flatDaySets]);

      const filteredRecipes = useMemo(() => {
        if (recipeCategory === 'Все') return mealTemplates;
        return mealTemplates.filter((m) => m.category === recipeCategory);
      }, [mealTemplates, recipeCategory]);

      const addMealToLog = (meal) => {
        setNutritionLog((prev) => ({
          ...prev,
          entries: [...prev.entries, { ...meal, uid: Date.now() + Math.random() }],
        }));
      };

      const nutritionTotals = useMemo(() => {
        return nutritionLog.entries.reduce(
          (acc, m) => ({
            kcal: acc.kcal + (Number(m.kcal) || 0),
            p: acc.p + (Number(m.p) || 0),
            f: acc.f + (Number(m.f) || 0),
            c: acc.c + (Number(m.c) || 0),
          }),
          { kcal: 0, p: 0, f: 0, c: 0 }
        );
      }, [nutritionLog.entries]);

      const targetKcal = nutritionLog.dayType === 'workout' ? 3000 : 2500;
      const targetProtein = Math.round((nutritionLog.bodyweight || 78) * 2.0);

      const bench1RM = exercises.find((e) => e.id === 'bench')?.oneRepMax || 0;
      const progressTo100Pct = Math.min(100, Math.round((bench1RM / 100) * 100));

      const sbdTotal = useMemo(() => {
        const s = exercises.find((e) => e.id === 'squat')?.oneRepMax || 0;
        const b = exercises.find((e) => e.id === 'bench')?.oneRepMax || 0;
        const d = exercises.find((e) => e.id === 'deadlift')?.oneRepMax || 0;
        return Number((s + b + d).toFixed(1));
      }, [exercises]);

      const dotsScore = useMemo(
        () => calculateDOTS(sbdTotal, nutritionLog.bodyweight),
        [sbdTotal, nutritionLog.bodyweight]
      );

      const handleExportBackup = () => {
        const payload = { exercises, completedSets, mealTemplates, nutritionLog };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ironcore_100kg_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportBackup = async (file) => {
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (data.exercises) setExercises(data.exercises);
          if (data.completedSets) setCompletedSets(data.completedSets);
          if (data.mealTemplates) setMealTemplates(data.mealTemplates);
          if (data.nutritionLog) setNutritionLog(data.nutritionLog);
          alert('Бэкап успешно восстановлен!');
        } catch {
          alert('Ошибка чтения JSON.');
        }
      };

      return (
        <div className="max-w-5xl mx-auto px-4 pt-4 sm:pt-8">
          {/* ================= TOP HEADER ================= */}
          <header className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-5 border-b border-borderSubtle">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-b from-zinc-800 to-zinc-950 border border-zinc-700/80 flex items-center justify-center shadow-lg">
                  <span className="font-mono font-bold text-sm text-emerald-400">100</span>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-base font-semibold tracking-tight text-zinc-50">IRON CORE</h1>
                    <span className="px-2 py-0.5 text-[10px] font-mono uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/25 rounded-full">
                      Путь до 100 кг
                    </span>
                  </div>
                  <p className="text-xs text-zinc-500 mt-0.5">

                  </p>

              </div>

              {/* Таймер Mobile */}
              <div className="sm:hidden flex items-center gap-1 bg-surface border border-borderSubtle rounded-xl p-1">

                    className="px-2 py-1 rounded-lg bg-zinc-900 border border-zinc-800 font-mono text-[11px] text-zinc-200 active:scale-95"

                  </button>

                      />
                      <span className="text-[9px] text-zinc-500 font-mono">кг</span>
                    </div>
                  </div>

              <div className="hidden sm:flex items-center gap-1.5 bg-surface border border-borderSubtle rounded-xl p-1.5">

                {[

                  { label: '3м', sec: 180 },
                  { label: '5м', sec: 300 },

                  <button
                    key={t.sec}
                    onClick={() => startTimer(t.sec)}
                    className="px-2.5 py-1 rounded-lg bg-zinc-900 border border-zinc-700/80 font-mono text-xs text-zinc-200 hover:bg-zinc-800 active:scale-95 transition-all"

                    {t.label}

                {timerRunning && (

              </div>
            </div>
          </header>

          {/* Активная полоса таймера */}
          {timerRunning && (
            <div className="mt-3 bg-surface border border-emerald-500/40 rounded-xl p-3 flex items-center justify-between gap-4 shadow-lg">
              <div className="flex items-center gap-3 flex-1">
                <span className="font-mono tabular text-lg font-bold text-emerald-400">
                  ⏱ {formatTime(timerSec)}
                </span>
                <div className="flex-1 h-2 bg-zinc-900 rounded-full overflow-hidden border border-zinc-800">
                  <div
                    style={{ width: `${Math.max(0, (timerSec / timerTotal) * 100)}%` }}
                    className="h-full bg-emerald-400 transition-all duration-1000 linear"
                  />

              </div>
              <button
                onClick={() => setTimerRunning(false)}
                className="px-2.5 py-1 rounded-lg bg-zinc-800 text-xs font-mono text-zinc-300 hover:text-white"
              >
                Сброс
              </button>
            </div>
          )}

          {/* ================= DESKTOP TABS ================= */}
          <nav className="hidden sm:flex items-center gap-1 my-5 p-1 bg-surface border border-borderSubtle rounded-xl w-fit">
            {[
              { id: 'workout', label: '1. Путь до 100 кг (13 недель)' },
              { id: '1rm', label: '2. База 1ПМ & e1RM' },
              { id: 'nutrition', label: '3. КБЖУ & ПП Рецепты (15)' },
              { id: 'analytics', label: '4. Аналитика & DOTS' },
            ].map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-1.5 rounded-lg text-xs font-medium transition-all ${
                  activeTab === tab.id
                    ? 'bg-zinc-800 text-zinc-50 shadow-sm border border-zinc-700/70'
                    : 'text-zinc-400 hover:text-zinc-200'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          {/* ================= TAB 1: ПРОГРАММА 13 НЕДЕЛЬ ================= */}
          {activeTab === 'workout' && (
            <div className="space-y-4 mt-5">
              <div className="bg-surface border border-borderSubtle rounded-2xl p-3.5">
                <div className="flex items-center justify-between mb-2.5">
                  <span className="text-[11px] uppercase tracking-wider text-zinc-500 font-medium">
                    Цикл подготовки (13 недель):
                  </span>
                  <span className="text-xs font-semibold text-emerald-400">{weekObj.title}</span>
                </div>
                <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
                  {BUILTIN_13_WEEKS.map((w) => (
                    <button
                      key={w.week}
                      onClick={() => {
                        setSelectedWeek(w.week);
                        setSelectedDayIdx(0);
                      }}
                      className={`px-3.5 py-1.5 rounded-xl font-mono tabular text-xs font-medium border shrink-0 transition-all ${
                        selectedWeek === w.week
                          ? 'bg-emerald-500 text-zinc-950 border-emerald-400 font-bold shadow-md shadow-emerald-500/15'
                          : 'bg-[#0B0B0E] text-zinc-400 border-zinc-800 hover:text-zinc-200'
                      }`}
                    >
                      Нед {w.week}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-5 space-y-4">
                  <div className="bg-surface border border-borderSubtle rounded-2xl p-4">
                    <div className="text-xs font-semibold text-zinc-200 mb-2.5">Тренировочный день</div>
                    <div className="grid grid-cols-3 gap-2">
                      {weekObj.days.map((d, idx) => (
                        <button
                          key={d.day}
                          onClick={() => setSelectedDayIdx(idx)}
                          className={`py-2.5 px-3 rounded-xl text-xs font-semibold border transition-all ${
                            selectedDayIdx === idx
                              ? 'bg-zinc-100 text-zinc-950 border-zinc-100 shadow'
                              : 'bg-[#0B0B0E] text-zinc-400 border-zinc-800 hover:text-zinc-200'
                          }`}
                        >
                          {d.day}
                        </button>
                      ))}

                    <div className="mt-4 pt-3 border-t border-borderSubtle">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-[11px] text-zinc-400">Авто-регуляция дня:</span>
                        <span className="font-mono tabular text-xs font-semibold text-emerald-400">
                          {readinessShift > 0 ? `+${readinessShift}%` : `${readinessShift}%`}
                        </span>
                      </div>
                      <div className="grid grid-cols-4 gap-1.5">
                        {[
                          { label: '-5%', val: -5 },

                          { label: '+2.5%', val: 2.5 },
                        ].map((opt) => (
                          <button
                            key={opt.val}
                            onClick={() => setReadinessShift(opt.val)}
                            className={`py-1.5 rounded-lg font-mono text-[11px] border ${
                              readinessShift === opt.val
                                ? 'bg-zinc-800 border-zinc-500 text-zinc-100'
                                : 'bg-[#0C0C0F] border-zinc-800/80 text-zinc-500'
                            }`}
                          >
                            {opt.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {activePlateTarget && (
                    <Barbell3DVisualizer
                      targetWeight={activePlateTarget.weight}
                      barbellWeight={activePlateTarget.barbell}
                      title={activePlateTarget.title}
                    />
                  )}
                </div>

                <div className="lg:col-span-7">
                  <div className="bg-surface border border-borderSubtle rounded-2xl overflow-hidden shadow-xl">
                    <div className="px-4 py-3.5 border-b border-borderSubtle flex items-center justify-between">
                      <div>
                        <h2 className="text-sm font-semibold text-zinc-100">{dayObj.title}</h2>
                        <p className="text-[11px] text-zinc-500">
                          Выполнено подходов: {completedSetsCount} из {flatDaySets.length}
                        </p>
                      </div>
                      <div className="text-right">
                        <div className="text-[10px] uppercase text-zinc-500">Тоннаж</div>
                        <div className="font-mono tabular text-sm font-semibold text-emerald-400">
                          {dayTonnage} кг
                        </div>
                      </div>
                    </div>

                    <div className="divide-y divide-borderSubtle">
                      {computedDayItems.map((item, idx) => (
                        <div
                          key={idx}
                          className={`p-4 transition-colors ${item.isBase ? 'bg-emerald-950/10' : ''}`}
                        >
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <div className="flex items-center gap-2 flex-wrap">
                                <span className="font-mono text-xs text-zinc-500">{idx + 1}.</span>
                                <span className="text-sm font-semibold text-zinc-100">{item.name}</span>
                                {item.isBase && (
                                  <span className="px-1.5 py-0.5 text-[10px] font-mono rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                                    БАЗА · 1ПМ {item.oneRepMax} кг
                                  </span>
                                )}
                              </div>
                              {item.note && <p className="text-[11px] text-zinc-400 mt-1">{item.note}</p>}

                          </div>

                          <div className="mt-3 space-y-2.5">
                            {item.computedBlocks.map((b, bIdx) => (
                              <div
                                key={bIdx}
                                onClick={() =>
                                  b.weightKg &&
                                  setActivePlateTarget({
                                    weight: b.weightKg,
                                    barbell: b.barbellWeight || 20,
                                    title: `${item.name} · ${b.effectivePct}% × ${b.reps} повт.`,
                                  })
                                }
                                className={`p-3 rounded-xl bg-[#0B0B0E] border border-zinc-800/90 ${
                                  b.weightKg ? 'cursor-pointer hover:border-zinc-600' : ''
                                }`}
                              >
                                <div className="flex items-center justify-between mb-2">
                                  <div className="flex items-center gap-2">
                                    {b.weightKg ? (
                                      <>
                                        <span className="font-mono tabular text-base font-bold text-emerald-400">
                                          {b.weightKg} кг
                                        </span>
                                        <span className="font-mono tabular text-[11px] text-zinc-400">
                                          ({b.effectivePct}% × {b.reps} повт. × {b.sets} подх.)
                                        </span>
                                      </>
                                    ) : (
                                      <span className="font-mono tabular text-xs text-zinc-300">
                                        Подсобка: {b.reps} повт. × {b.sets} подх. (вес свой)
                                      </span>
                                    )}
                                  </div>
                                  {b.weightKg && <span className="text-[10px] font-mono text-zinc-500">3D Штанга →</span>}
                                </div>

                                <div className="flex flex-wrap gap-1.5" onClick={(e) => e.stopPropagation()}>
                                  {Array.from({ length: b.sets }).map((_, sIdx) => {
                                    const setKey = `${b.blockKey}-s${sIdx}`;
                                    const done = !!completedSets[setKey];
                                    const isNextFocus = nextPendingSet?.setKey === setKey;
                                    return (
                                      <button

                                          done

                                            : isNextFocus

                                            : 'bg-surface border-zinc-800 text-zinc-400 hover:border-zinc-600'

                                      >
                                        <span>#{sIdx + 1}</span>
                                        <span>·</span>

          {activeTab === '1rm' && (

                      <div>
                        <div className="text-sm font-medium text-zinc-100">{ex.name}</div>
                        <div className="text-[11px] font-mono text-zinc-500">Гриф {ex.barbellWeight} кг · Шаг 2.5 кг</div>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => handleUpdate1RM(ex.id, ex.oneRepMax - 2.5)}
                          className="w-9 h-9 rounded-lg bg-zinc-900 border border-zinc-700 font-mono text-xs text-zinc-300"
                        >
                          -2.5
                        </button>
                        <div className="flex items-baseline bg-surface border border-zinc-700 rounded-lg px-3 py-1.5">
                          <input
                            type="number"
                            step="2.5"
                            value={ex.oneRepMax || ''}
                            onChange={(e) => handleUpdate1RM(ex.id, e.target.value)}
                            className="w-16 text-center bg-transparent font-mono tabular text-base font-bold text-emerald-400 focus:outline-none"
                          />
                          <span className="text-xs text-zinc-500 font-mono">кг</span>
                        </div>
                        <button
                          onClick={() => handleUpdate1RM(ex.id, ex.oneRepMax + 2.5)}
                          className="w-9 h-9 rounded-lg bg-zinc-900 border border-zinc-700 font-mono text-xs text-zinc-300"
                        >
                          +2.5
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="lg:col-span-5 bg-surface border border-borderSubtle rounded-2xl p-5 h-fit">
                <h3 className="text-sm font-semibold text-zinc-100">Калькулятор e1RM (Эпли / Бжицки)</h3>
                <p className="text-xs text-zinc-500 mt-1">
                  Оценка максимума по рабочему подходу и обновление базы в 1 клик.
                </p>

                <div className="mt-4">
                  <label className="text-[11px] text-zinc-500 block mb-1">Упражнение:</label>
                  <select
                    value={calcExId}
                    onChange={(e) => setCalcExId(e.target.value)}
                    className="w-full bg-[#0B0B0E] border border-zinc-800 rounded-lg px-3 py-2 text-xs text-zinc-200 focus:outline-none"
                  >
                    {exercises.map((ex) => (
                      <option key={ex.id} value={ex.id}>{ex.name}</option>
                    ))}
                  </select>
                </div>

                <div className="grid grid-cols-2 gap-3 mt-3">
                  <div className="bg-[#0B0B0E] border border-zinc-800 rounded-lg p-3">
                    <label className="text-[11px] text-zinc-500 block">Вес (кг)</label>
                    <input
                      type="number"
                      step="2.5"
                      value={calcWeight}
                      onChange={(e) => setCalcWeight(parseFloat(e.target.value) || 0)}
                      className="w-full mt-1 bg-transparent font-mono tabular text-lg font-bold text-zinc-100 focus:outline-none"
                    />
                  </div>
                  <div className="bg-[#0B0B0E] border border-zinc-800 rounded-lg p-3">
                    <label className="text-[11px] text-zinc-500 block">Повторения</label>
                    <input
                      type="number"
                      min="1"
                      max="20"
                      value={calcReps}
                      onChange={(e) => setCalcReps(parseInt(e.target.value, 10) || 1)}
                      className="w-full mt-1 bg-transparent font-mono tabular text-lg font-bold text-zinc-100 focus:outline-none"
                    />
                  </div>
                </div>

                <div className="mt-4 p-4 rounded-xl bg-[#0B0B0E] border border-emerald-500/20 flex items-center justify-between">
                  <div>
                    <div className="text-[11px] text-zinc-400">Расчетный 1ПМ:</div>
                    <div className="font-mono tabular text-2xl font-bold text-emerald-400">
                      {calculateE1RM(calcWeight, calcReps)} кг
                    </div>
                  </div>
                  <button
                    onClick={() => handleUpdate1RM(calcExId, roundToStep(calculateE1RM(calcWeight, calcReps), 2.5, 20))}
                    className="px-3 py-2 rounded-lg bg-emerald-500 text-zinc-950 text-xs font-bold hover:bg-emerald-400 active:scale-95"
                  >
                    Применить в 1ПМ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= TAB 3: КБЖУ & РЕЦЕПТЫ ИЗ ТГ «ПП ГОЛОВНОГО МОЗГА» ================= */}
          {activeTab === 'nutrition' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mt-5">
              {/* Левая колонка: Калораж + База рецептов из ТГ канала */}
              <div className="lg:col-span-6 space-y-4">
                <div className="bg-surface border border-borderSubtle rounded-2xl p-4">
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-xs font-semibold text-zinc-200">Утренний вес и калораж</span>
                    <div className="flex items-baseline gap-1 bg-[#0B0B0E] border border-zinc-800 rounded-lg px-2.5 py-1">
                      <input
                        type="number"
                        step="0.1"
                        value={nutritionLog.bodyweight}
                        onChange={(e) =>
                          setNutritionLog((prev) => ({ ...prev, bodyweight: parseFloat(e.target.value) || 0 }))
                        }
                        className="w-12 bg-transparent font-mono tabular text-sm font-bold text-zinc-100 text-right focus:outline-none"
                      />
                      <span className="text-[11px] font-mono text-zinc-500">кг</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => setNutritionLog((p) => ({ ...p, dayType: 'workout' }))}
                      className={`py-2 px-3 rounded-xl text-xs font-medium border ${
                        nutritionLog.dayType === 'workout'
                          ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'
                          : 'bg-[#0B0B0E] border-zinc-800 text-zinc-400'
                      }`}
                    >
                      Тренировочный (3000)
                    </button>
                    <button
                      onClick={() => setNutritionLog((p) => ({ ...p, dayType: 'rest' }))}
                      className={`py-2 px-3 rounded-xl text-xs font-medium border ${
                        nutritionLog.dayType === 'rest'
                          ? 'bg-zinc-800 border-zinc-600 text-zinc-100'
                          : 'bg-[#0B0B0E] border-zinc-800 text-zinc-400'
                      }`}
                    >
                      День отдыха (2500)
                    </button>
                  </div>
                </div>

                {/* Рецепты из ТГ канала «Пп головного мозга» с фильтрами */}
                <div className="bg-surface border border-borderSubtle rounded-2xl p-4">
                  <div className="flex items-center justify-between mb-2.5">
                    <span className="text-xs font-semibold text-zinc-200">
                      База рецептов · «Пп головного мозга» ({filteredRecipes.length})
                    </span>
                  </div>

                  {/* Фильтр по топикам ТГ-канала */}
                  <div className="flex items-center gap-1.5 overflow-x-auto pb-2 mb-3">
                    {['Все', 'Завтрак', 'Обед', 'Ужин', 'Десерты', 'Салаты', 'Выпечка'].map((cat) => (
                      <button
                        key={cat}
                        onClick={() => setRecipeCategory(cat)}
                        className={`px-2.5 py-1 rounded-lg text-[11px] font-medium border shrink-0 transition-colors ${
                          recipeCategory === cat
                            ? 'bg-zinc-100 text-zinc-950 border-zinc-100 font-semibold'
                            : 'bg-[#0B0B0E] text-zinc-400 border-zinc-800 hover:text-zinc-200'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  <div className="space-y-2 max-h-[520px] overflow-y-auto pr-1">
                    {filteredRecipes.map((meal) => (
                      <div
                        key={meal.id}
                        className="p-3 rounded-xl bg-[#0B0B0E] border border-zinc-800/90 hover:border-zinc-700 transition-colors"
                      >
                        <div className="flex items-start justify-between gap-2">
                          <div className="min-w-0">
                            <div className="flex items-center gap-1.5 mb-1">
                              <span className="px-1.5 py-0.5 text-[9px] font-mono uppercase rounded bg-zinc-800 text-zinc-400">
                                {meal.category}
                              </span>
                              {meal.video && (
                                <span className="px-1.5 py-0.5 text-[9px] font-mono rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                  ▶ Видео
                                </span>
                              )}
                            </div>
                            <div className="text-xs font-semibold text-zinc-100 leading-snug">{meal.name}</div>
                            <div className="font-mono tabular text-[10px] text-zinc-500 mt-1">
                              {meal.kcal} ккал · Б: {meal.p}г · Ж: {meal.f}г · У: {meal.c}г
                            </div>
                          </div>

                          <div className="flex flex-col gap-1.5 shrink-0">
                            <button
                              onClick={() => addMealToLog(meal)}
                              className="px-2.5 py-1.5 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/40 font-mono text-[11px] font-bold text-emerald-300 active:scale-95"
                            >
                              + {meal.kcal}
                            </button>
                            <button
                              onClick={() => setActiveRecipeModal(meal)}
                              className="px-2.5 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/80 text-[10px] font-medium text-zinc-300"
                            >
                              Рецепт
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Правая колонка: Сводка КБЖУ за день */}
              <div className="lg:col-span-6">
                <div className="bg-surface border border-borderSubtle rounded-2xl p-5 sticky top-4">
                  <div className="flex items-baseline justify-between mb-4">
                    <div>
                      <div className="text-xs text-zinc-500">Сводка КБЖУ за сегодня</div>
                      <div className="font-mono tabular text-2xl font-bold text-zinc-100 mt-0.5">
                        {nutritionTotals.kcal}{' '}
                        <span className="text-sm font-normal text-zinc-500">/ {targetKcal} ккал</span>
                      </div>
                    </div>
                    <button
                      onClick={() => setNutritionLog((p) => ({ ...p, entries: [] }))}
                      className="text-[11px] text-zinc-500 hover:text-zinc-300 underline"
                    >
                      Очистить день
                    </button>
                  </div>

                  <div className="w-full h-2.5 bg-[#0B0B0E] rounded-full overflow-hidden border border-zinc-800 mb-5">
                    <div
                      style={{ width: `${Math.min(100, (nutritionTotals.kcal / targetKcal) * 100)}%` }}
                      className="h-full bg-emerald-500 transition-all duration-300"
                    />
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div className="p-3 rounded-xl bg-[#0B0B0E] border border-zinc-800">
                      <div className="text-[11px] text-zinc-500">Белки</div>
                      <div className="font-mono tabular text-base font-bold text-emerald-400 mt-0.5">
                        {Math.round(nutritionTotals.p)} / {targetProtein} г
                      </div>
                    </div>
                    <div className="p-3 rounded-xl bg-[#0B0B0E] border border-zinc-800">
                      <div className="text-[11px] text-zinc-500">Жиры</div>
                      <div className="font-mono tabular text-base font-bold text-zinc-100 mt-0.5">
                        {Math.round(nutritionTotals.f)} г
                      </div>
                    </div>
                    <div className="p-3 rounded-xl bg-[#0B0B0E] border border-zinc-800">
                      <div className="text-[11px] text-zinc-500">Углеводы</div>
                      <div className="font-mono tabular text-base font-bold text-zinc-100 mt-0.5">
                        {Math.round(nutritionTotals.c)} г
                      </div>
                    </div>
                  </div>

                  <div className="mt-5 pt-4 border-t border-borderSubtle space-y-1.5">
                    <div className="text-xs font-medium text-zinc-400 mb-2">Съедено сегодня:</div>
                    {nutritionLog.entries.length === 0 ? (
                      <div className="text-xs text-zinc-600 py-3">Пока пусто. Нажми «+ ккал» на любом рецепте слева.</div>
                    ) : (
                      nutritionLog.entries.map((item, idx) => (
                        <div
                          key={item.uid || idx}
                          className="flex items-center justify-between px-3 py-2 rounded-lg bg-[#0B0B0E] border border-zinc-800 text-xs"
                        >
                          <span className="text-zinc-200 truncate pr-2">{item.name}</span>
                          <div className="flex items-center gap-3 shrink-0">
                            <span className="font-mono tabular text-zinc-400">{item.kcal} ккал</span>
                            <button
                              onClick={() =>
                                setNutritionLog((p) => ({
                                  ...p,
                                  entries: p.entries.filter((_, i) => i !== idx),
                                }))
                              }
                              className="text-zinc-500 hover:text-red-400 font-mono"
                            >
                              ×
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================= TAB 4: ANALYTICS & DOTS ================= */}
          {activeTab === 'analytics' && (
            <div className="mt-5 space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div className="bg-surface border border-borderSubtle rounded-2xl p-4">
                  <div className="text-[11px] uppercase text-zinc-500">Сумма троеборья (SBD)</div>
                  <div className="font-mono tabular text-2xl font-bold text-zinc-100 mt-1">{sbdTotal} кг</div>
                </div>
                <div className="bg-surface border border-borderSubtle rounded-2xl p-4">
                  <div className="text-[11px] uppercase text-zinc-500">Коэффициент DOTS (IPF)</div>
                  <div className="font-mono tabular text-2xl font-bold text-emerald-400 mt-1">{dotsScore}</div>
                </div>
                <div className="bg-surface border border-borderSubtle rounded-2xl p-4">
                  <div className="text-[11px] uppercase text-zinc-500">Резервная копия JSON</div>
                  <div className="flex items-center gap-2 mt-2">
                    <button
                      onClick={handleExportBackup}
                      className="px-3 py-1.5 rounded-lg bg-zinc-100 text-zinc-950 text-xs font-semibold"
                    >
                      Экспорт
                    </button>
                    <button
                      onClick={() => importJsonRef.current?.click()}
                      className="px-3 py-1.5 rounded-lg bg-[#0B0B0E] border border-zinc-700 text-zinc-300 text-xs"
                    >
                      Импорт
                    </button>
                    <input
                      ref={importJsonRef}
                      type="file"
                      accept="application/json"
                      className="hidden"
                      onChange={(e) => handleImportBackup(e.target.files?.[0])}
                    />
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================= RECIPE & VIDEO MODAL ================= */}
          <RecipeModal
            recipe={activeRecipeModal}
            onClose={() => setActiveRecipeModal(null)}
            onAddMeal={addMealToLog}
          />

          {/* ================= FLOATING ACTION BAR: «СЛЕДУЮЩИЙ ПОДХОД» ================= */}
          {activeTab === 'workout' && (
            <div className="fixed bottom-16 sm:bottom-5 left-0 right-0 px-4 z-40 pointer-events-none">
              <div className="max-w-xl mx-auto pointer-events-auto">
                <div className="apple-glass border border-zinc-700/80 rounded-2xl p-2.5 shadow-[0_14px_40px_rgba(0,0,0,0.85)] flex items-center justify-between gap-3">
                  {nextPendingSet ? (
                    <>
                      <div className="pl-2 min-w-0">
                        <div className="text-[10px] uppercase tracking-wider text-zinc-400 truncate">
                          {nextPendingSet.exerciseName}
                        </div>
                        <div className="font-mono tabular text-sm font-bold text-zinc-100 truncate">
                          {nextPendingSet.weightKg
                            ? `${nextPendingSet.weightKg} кг × ${nextPendingSet.reps} повт. (#${nextPendingSet.setNumber})`
                            : `${nextPendingSet.reps} повт. · Подход #${nextPendingSet.setNumber}`}
                        </div>
                      </div>
                      <button
                        onClick={handleCompleteNextSet}
                        className="shrink-0 px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 text-xs font-bold tracking-tight shadow-lg shadow-emerald-500/20 active:scale-95 transition-all"
                      >
                        Следующий подход ✓
                      </button>
                    </>
                  ) : (
                    <div className="w-full py-1.5 text-center text-xs font-semibold text-emerald-400">
                      🎉 Все подходы сегодняшней тренировки выполнены!
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================= MOBILE BOTTOM NAVIGATION ================= */}
          <nav className="sm:hidden fixed bottom-0 left-0 right-0 apple-glass border-t border-borderSubtle px-2 pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] z-50">
            <div className="grid grid-cols-4 gap-1">
              {[
                { id: 'workout', label: 'Программа' },
                { id: '1rm', label: 'База 1ПМ' },
                { id: 'nutrition', label: 'КБЖУ & ПП' },
                { id: 'analytics', label: 'DOTS' },
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`py-2 rounded-xl text-[11px] font-medium transition-colors ${
                    activeTab === tab.id ? 'bg-zinc-800 text-zinc-50 font-semibold' : 'text-zinc-500'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
